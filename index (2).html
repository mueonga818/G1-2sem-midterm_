<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중1학년_2학기_중간고사_과학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FC; --grid:#E2E9F5; --ink:#1C2541; --muted:#646F8C; --rule:#C9D3E6;
  --force:#2E5BDB; --force-soft:#E4EBFC; --matter:#0B8A70; --matter-soft:#DDF3EC;
  --pen:#D7263D; --card:#FFFFFF; --chip:#EDF1F8;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --head:"Do Hyeon","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --hand:"Nanum Pen Script","IBM Plex Sans KR",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141A2B; --grid:#1D2539; --ink:#E7ECF7; --muted:#9AA5C2; --rule:#33405E;
  --force:#7C9BFF; --force-soft:#1F2C55; --matter:#4FD1B0; --matter-soft:#12382F;
  --pen:#FF6B7D; --card:#1A2135; --chip:#232C45;}}
:root[data-theme="dark"]{
  --paper:#141A2B; --grid:#1D2539; --ink:#E7ECF7; --muted:#9AA5C2; --rule:#33405E;
  --force:#7C9BFF; --force-soft:#1F2C55; --matter:#4FD1B0; --matter-soft:#12382F;
  --pen:#FF6B7D; --card:#1A2135; --chip:#232C45;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 80px}
header h1{font-family:var(--head);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.15;margin:8px 0 6px;letter-spacing:-.5px}
header p{margin:0;color:var(--muted)}
.units{display:flex;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.unit-tag{font-family:var(--head);font-size:20px;padding:4px 14px;border-radius:999px}
.unit-tag.f{background:var(--force-soft);color:var(--force)} .unit-tag.s{background:var(--matter-soft);color:var(--matter)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);margin:18px -18px 0;padding:12px 18px 10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.row .lbl{font-size:13px;color:var(--muted);width:44px;flex-shrink:0}
.seg{border:1.5px solid var(--rule);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:4px 11px;border-radius:8px;cursor:pointer}
.seg.sub{font-weight:700}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg:focus-visible,.choice:focus-visible,.btn:focus-visible{outline:3px solid var(--force);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.btn{font:inherit;font-size:14px;font-weight:500;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.primary{background:var(--pen);color:#fff}
.count{margin-left:auto;font-size:13px;color:var(--muted)}
.notice{background:var(--card);border-left:4px solid var(--pen);padding:10px 14px;margin:18px 0 0;font-size:14px;color:var(--muted)}
ol.qs{list-style:none;margin:20px 0 0;padding:0}
.q{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:18px 18px 16px;margin:0 0 14px;position:relative}
.q.F{border-top:4px solid var(--force)} .q.S{border-top:4px solid var(--matter)}
.qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.qnum{font-family:var(--head);font-size:24px;line-height:1}
.meta{font-size:12.5px;color:var(--muted)}
.meta b{font-weight:700}
.q.F .meta b{color:var(--force)} .q.S .meta b{color:var(--matter)}
.star{margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:var(--rule);padding:0 4px;line-height:1}
.star[aria-pressed="true"]{color:var(--pen)}
.qtext{font-size:16.5px}
.qtext u{text-underline-offset:3px;font-weight:700}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{border-collapse:collapse;font-size:14.5px;min-width:max-content}
.tbl td{border:1px solid var(--rule);padding:5px 12px;text-align:center}
.tbl tr:first-child td,.tbl td:first-child{background:var(--chip);font-weight:500}
.box{border:1.5px solid var(--rule);border-radius:4px;padding:8px 14px;margin:10px 0;font-size:15px}
.box div{margin:2px 0}
.choices{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px}
.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:5px 8px;font:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;position:relative}
.choice:hover{background:var(--chip)}
.choice .no{flex-shrink:0;width:22px;height:22px;display:inline-grid;place-items:center;position:relative}
.choice.right .no::after{content:"";position:absolute;inset:-7px;border:2.5px solid var(--pen);border-radius:50%;transform:rotate(-8deg)}
.choice.wrong{color:var(--muted)}
.choice.wrong .no::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;border-top:2.5px solid var(--pen);transform:rotate(-35deg)}
.reveal{margin-top:10px}
.ans{display:none;margin-top:10px;padding:8px 12px;border-top:1.5px dashed var(--rule)}
.ans.show{display:block}
.ans .hand{font-family:var(--hand);font-size:25px;line-height:1.25;color:var(--pen)}
.ans .hand.long{font-size:21px;line-height:1.35}
.ans .exp{font-size:14.5px;color:var(--muted);margin-top:4px}
.lines{display:none;margin-top:10px}
.lines div{border-bottom:1px solid var(--rule);height:30px}
@media print{body.exam .lines{display:block}}
.typed{margin-top:10px}
.typed textarea{width:100%;min-height:72px;resize:vertical;font:inherit;font-size:16px;line-height:1.6;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:8px 10px}
.typed textarea:focus-visible{outline:3px solid var(--force);outline-offset:1px;border-color:var(--force)}
.typed .saved{font-size:12px;color:var(--muted);margin-top:2px;min-height:18px}
.self{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.self .btn{font-size:13px;padding:5px 11px}
.self .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mine{font-size:14.5px;margin-bottom:6px;white-space:pre-wrap}
.mine b{color:var(--muted);font-weight:500}
body.exam .reveal,body.exam .ans{display:none!important}
body.exam .choice{cursor:default}
.key{display:none;margin-top:36px}
body.exam .key{display:block}
.key h2{font-family:var(--head);font-weight:400;font-size:30px;margin:0 0 10px}
.key .k{background:var(--card);border:1px solid var(--rule);padding:10px 14px;margin-bottom:8px;font-size:14.5px}
.key .k .hand{font-family:var(--hand);font-size:23px;color:var(--pen);line-height:1.25}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.more{display:block;margin:10px auto 0}
@media (max-width:640px){.bar{position:static}}
@media (max-width:520px){.wrap{padding:20px 12px 60px}.bar{margin:14px -12px 0;padding:10px 12px}.q{padding:14px 13px}.row .lbl{width:100%}}
@media (prefers-reduced-motion:no-preference){.ans.show{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1}}}
@media print{
  body{background:#fff;color:#000}
  .bar,.notice,.star,.reveal,.more,header .units,.typed,.self{display:none!important}
  .q{break-inside:avoid;border:1px solid #999;border-top-width:1px}
  .key{break-before:page}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>중1 2학기 중간고사 문제은행</h1>
  <p id="subDesc"></p>
  <div class="units" id="unitTags"></div>
</header>
<div class="bar" id="bar">
  <div class="row"><span class="lbl">과목</span><span id="fs"></span></div>
  <div class="row"><span class="lbl">단원</span><span id="fu"></span></div>
  <div class="row"><span class="lbl">배점</span><span id="fl"></span></div>
  <div class="row"><span class="lbl">유형</span><span id="ft"></span></div>
  <div class="actions">
    <button class="btn" id="modeBtn" type="button">시험지 모드로 바꾸기</button>
    <button class="btn primary" id="mockBtn" type="button">모의고사 20문항 만들기</button>
    <button class="btn" id="printBtn" type="button">인쇄</button>
    <span class="count" id="count"></span>
  </div>
</div>
<p class="notice" id="notice"><span id="subNote"></span> 공부하기 모드에서는 보기를 누르면 바로 채점돼요. ★을 누르면 '다시 볼 문제'로 모아 볼 수 있어요. 서술형은 칸에 답을 적은 뒤 '정답 보기'로 모범 답안과 비교해 보세요. 적은 답은 이 기기에 자동으로 저장돼요.</p>
<ol class="qs" id="list"></ol>
<section class="key" id="key"></section>
</div>
<script>
var u='',l=0,D=[];
function T(rows){return '<div class="tbl"><table>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}
function B(items){return '<div class="box">'+items.map(function(i){return '<div>'+i+'</div>'}).join('')+'</div>'}
function m(q,c,a,e){D.push({u:u,l:l,t:'m',q:q,c:c,a:a,e:e})}
function s(q,a,e){D.push({u:u,l:l,t:'s',q:q,a:a,e:e})}
</script>
<script>
u='F';l=1;
m(`과학에서 말하는 '힘'에 대한 설명으로 옳은 것은?`,[`힘의 단위는 kg이다.`,`힘은 물체의 모양이나 운동 상태를 변하게 하는 원인이다.`,`힘은 눈으로 직접 볼 수 있다.`,`힘은 크기만 있고 방향은 없다.`,`정지해 있는 물체에는 힘을 작용할 수 없다.`],2,`힘은 물체의 모양이나 운동 상태(빠르기, 방향)를 변하게 하는 원인이며, 단위는 N(뉴턴)이다.`);
m(`힘의 단위로 옳은 것은?`,[`g`,`kg`,`N`,`cm`,`L`],3,`힘의 단위는 N(뉴턴)이다. g, kg은 질량의 단위이다.`);
m(`힘을 화살표로 나타낼 때, 화살표의 '길이'가 나타내는 것은?`,[`힘의 방향`,`힘의 크기`,`힘의 작용점`,`물체의 질량`,`물체의 부피`],2,`화살표의 길이는 힘의 크기, 방향은 힘의 방향, 시작점은 작용점을 나타낸다.`);
m(`힘을 화살표로 나타낼 때, 화살표의 '시작점'이 나타내는 것은?`,[`힘의 크기`,`힘의 방향`,`힘의 작용점`,`힘의 단위`,`힘의 종류`],3,`화살표의 시작점은 힘이 작용하는 점(작용점)이다.`);
m(`힘이 작용하여 물체의 '모양'이 변한 예는?`,[`굴러가던 공이 멈추었다.`,`찰흙을 손으로 눌렀더니 납작해졌다.`,`자전거의 속력이 빨라졌다.`,`날아오던 축구공의 방향이 바뀌었다.`,`떨어지는 사과가 점점 빨라졌다.`],2,`나머지는 모두 운동 상태(빠르기, 방향)가 변한 예이다.`);
m(`지구가 물체를 지구 중심 방향으로 당기는 힘은?`,[`마찰력`,`탄성력`,`중력`,`부력`,`자기력`],3,`지구가 물체를 당기는 힘을 중력이라고 한다.`);
m(`중력이 작용하는 방향은?`,[`지구 중심 방향`,`동쪽`,`물체가 움직이는 방향`,`하늘 쪽`,`북쪽`],1,`중력은 항상 지구 중심 방향(연직 아래 방향)으로 작용한다.`);
m(`물체에 작용하는 중력의 크기를 무엇이라고 하는가?`,[`질량`,`무게`,`부피`,`밀도`,`길이`],2,`무게는 물체에 작용하는 중력의 크기이며 단위는 N이다.`);
m(`질량의 단위로 옳은 것은?`,[`N`,`kg`,`cm`,`L`,`℃`],2,`질량의 단위는 g, kg 등이다.`);
m(`변형된 물체가 원래 모양으로 되돌아가려는 힘은?`,[`중력`,`마찰력`,`탄성력`,`부력`,`전기력`],3,`고무줄, 용수철처럼 변형된 물체가 원래대로 돌아가려는 힘이 탄성력이다.`);
m(`탄성력을 이용한 예가 <u>아닌</u> 것은?`,[`트램펄린`,`활`,`볼펜 속 용수철`,`장대높이뛰기`,`미끄럼틀에서 미끄러져 내려오기`],5,`미끄럼틀에서 내려오는 것은 중력에 의한 현상이다.`);
m(`두 물체의 접촉면에서 물체의 운동을 방해하는 힘은?`,[`마찰력`,`탄성력`,`중력`,`부력`,`자기력`],1,`접촉면에서 운동을 방해하는 힘은 마찰력이다.`);
m(`마찰력이 작용하는 방향은?`,[`물체가 운동하는(하려는) 방향과 반대 방향`,`물체가 운동하는 방향과 같은 방향`,`항상 아래쪽`,`항상 위쪽`,`지구 중심 방향`],1,`마찰력은 운동을 방해하므로 운동하거나 운동하려는 방향과 반대로 작용한다.`);
m(`액체나 기체가 그 속에 있는 물체를 위쪽으로 밀어 올리는 힘은?`,[`중력`,`탄성력`,`마찰력`,`부력`,`자기력`],4,`물이나 공기가 물체를 위로 밀어 올리는 힘을 부력이라고 한다.`);
m(`부력이 작용하는 방향은?`,[`아래쪽`,`위쪽(중력과 반대 방향)`,`옆쪽`,`물체가 움직이는 방향`,`지구 중심 방향`],2,`부력은 중력과 반대 방향인 위쪽으로 작용한다.`);
m(`물체의 무게를 측정하는 도구는?`,[`윗접시저울`,`양팔저울`,`용수철저울`,`눈금실린더`,`온도계`],3,`무게는 용수철저울로, 질량은 윗접시저울이나 양팔저울로 측정한다.`);
m(`물체의 질량을 측정하는 도구는?`,[`용수철저울`,`윗접시저울`,`자`,`온도계`,`눈금실린더`],2,`윗접시저울은 물체와 분동을 비교하여 질량을 측정한다.`);
m(`장소에 따라 변하지 않는 물체의 고유한 양은?`,[`무게`,`질량`,`중력`,`부력`,`탄성력`],2,`질량은 장소가 달라져도 변하지 않는다. 무게는 장소에 따라 달라진다.`);
m(`부력을 이용한 예로 옳은 것은?`,[`열기구`,`스키`,`미끄럼 방지 패드`,`활`,`볼베어링`],1,`열기구는 공기의 부력을 이용해 떠오른다.`);
m(`마찰력을 크게 하여 이용하는 예는?`,[`자전거 체인에 윤활유를 바른다.`,`겨울철 빙판길에 모래를 뿌린다.`,`스키 바닥에 왁스를 칠한다.`,`기계에 볼베어링을 사용한다.`,`물 미끄럼틀에 물을 흘려보낸다.`],2,`모래를 뿌리면 접촉면이 거칠어져 마찰력이 커진다. 나머지는 마찰력을 줄이는 예이다.`);
s(`물체의 모양이나 운동 상태를 변하게 하는 원인을 무엇이라고 하는가?`,`힘`,`과학에서 힘은 모양이나 운동 상태를 변화시키는 원인이다.`);
s(`힘을 화살표로 나타낼 때 필요한 힘의 3요소를 모두 쓰시오.`,`힘의 크기, 힘의 방향, 작용점`,`화살표 길이=크기, 화살표 방향=방향, 시작점=작용점`);
s(`힘의 단위 N은 무엇이라고 읽는가?`,`뉴턴`,`과학자 뉴턴의 이름에서 따왔다.`);
s(`지구가 물체를 당기는 힘을 무엇이라고 하는가?`,`중력`,`지구 위의 모든 물체에는 중력이 작용한다.`);
s(`중력이 작용하는 방향을 쓰시오.`,`지구 중심 방향(연직 아래 방향)`,`'아래쪽'만 쓰기보다 '지구 중심 방향'이라고 쓰는 것이 정확하다.`);
s(`물체에 작용하는 중력의 크기를 무엇이라고 하는가?`,`무게`,`무게의 단위는 N이다.`);
s(`물체의 고유한 양으로, 장소가 바뀌어도 변하지 않는 양을 무엇이라고 하는가?`,`질량`,`단위는 g, kg이다.`);
s(`고무줄을 잡아당겼다 놓으면 원래 모양으로 돌아간다. 이때 작용하는 힘은?`,`탄성력`,`변형된 물체가 원래대로 돌아가려는 힘이다.`);

m(`표는 용수철에 매단 추의 무게에 따라 용수철이 늘어난 길이를 나타낸 것이다.`+T([[`추의 무게(N)`,0,2,4,6,8],[`늘어난 길이(cm)`,0,1.5,3,4.5,6]])+`이 용수철에 10N짜리 추를 매달면 늘어난 길이는?`,[`6.5cm`,`7cm`,`7.5cm`,`8cm`,`10cm`],3,`2N마다 1.5cm씩 늘어난다. 10N은 2N의 5배 → 1.5 × 5 = 7.5cm`);
m(`2N마다 1.5cm씩 늘어나는 용수철이 9cm 늘어났다면 매단 물체의 무게는?`,[`9N`,`10N`,`12N`,`13.5N`,`18N`],3,`9 ÷ 1.5 = 6배 → 2N × 6 = 12N`);
m(`원래 길이가 10cm인 용수철에 5N짜리 추를 매달았더니 전체 길이가 12cm가 되었다. 15N짜리 추를 매달면 용수철의 전체 길이는?`,[`6cm`,`16cm`,`18cm`,`20cm`,`30cm`],2,`5N에 2cm 늘어남 → 15N이면 6cm 늘어남 → 10 + 6 = 16cm. '늘어난 길이'와 '전체 길이'를 구분해야 한다.`);
m(`지구에서 질량이 6kg인 물체를 달에 가져가서 윗접시저울과 용수철저울로 측정하였다. 측정값으로 옳은 것은? (단, 지구에서 질량 1kg의 무게는 9.8N이다.)`,[`1kg, 9.8N`,`6kg, 9.8N`,`6kg, 58.8N`,`1kg, 58.8N`,`6kg, 352.8N`],2,`질량은 6kg 그대로. 지구 무게 6×9.8=58.8N → 달에서는 1/6인 9.8N`);
m(`마찰력에 대한 설명으로 옳은 것을 모두 고른 것은?`+B([`ㄱ. 같은 접촉면에서 물체가 무거울수록 마찰력이 크다.`,`ㄴ. 접촉면의 넓이가 넓을수록 마찰력이 크다.`,`ㄷ. 접촉면이 거칠수록 마찰력이 크다.`,`ㄹ. 물체를 밀었는데 움직이지 않았다면 마찰력은 0이다.`]),[`ㄱ, ㄴ`,`ㄱ, ㄷ`,`ㄴ, ㄷ`,`ㄷ, ㄹ`,`ㄱ, ㄴ, ㄷ`],2,`넓이는 마찰력과 관계없다. 밀어도 움직이지 않을 때는 미는 힘과 같은 크기의 마찰력이 작용하고 있다.`);
m(`정지해 있는 상자를 오른쪽으로 20N의 힘으로 밀었으나 상자가 움직이지 않았다. 상자에 작용하는 마찰력의 크기와 방향은?`,[`0N`,`20N, 오른쪽`,`20N, 왼쪽`,`20N보다 크고 왼쪽`,`20N보다 작고 왼쪽`],3,`움직이지 않으면 미는 힘과 마찰력의 크기가 같고 방향은 반대이다.`);
m(`물체 A는 공기 중 12N, 물속 8N이고, 물체 B는 공기 중 20N, 물속 18N이다. 부력을 더 크게 받는 물체와 그 크기는?`,[`A, 4N`,`B, 2N`,`A, 8N`,`B, 18N`,`둘이 같다.`],1,`A: 12−8=4N, B: 20−18=2N → A가 더 크다. 무거운 물체가 부력을 더 받는 것은 아니다.`);
m(`어떤 물체를 물에 절반만 잠기게 했을 때 용수철저울 눈금은 9N, 완전히 잠기게 했을 때는 6N이었다. 이 물체의 공기 중 무게는?`,[`6N`,`9N`,`12N`,`15N`,`18N`],3,`절반→완전으로 잠긴 부피가 2배가 되면서 부력이 3N 더 늘었다. 절반일 때 부력 3N, 완전히 잠겼을 때 6N → 공기 중 무게 = 6 + 6 = 12N`);
m(`용수철저울에 매단 물체를 물속으로 천천히 넣을 때 저울 눈금의 변화로 옳은 것은? (물체는 바닥에 닿지 않는다.)`,[`계속 커진다.`,`작아지다가 물체가 완전히 잠긴 뒤로는 일정하다.`,`변하지 않는다.`,`커지다가 작아진다.`,`작아지다가 다시 커진다.`],2,`잠긴 부피가 커질수록 부력이 커져 눈금이 줄어들고, 완전히 잠긴 뒤에는 부력이 일정하다.`);
m(`작용하는 힘의 종류가 나머지 넷과 <u>다른</u> 하나는?`,[`트램펄린 위에서 뛰어오른다.`,`활시위를 당겼다 놓아 화살을 쏜다.`,`튜브를 타고 바다 위에 떠 있다.`,`장대높이뛰기 선수가 장대를 이용해 넘는다.`,`용수철 장난감이 튀어 오른다.`],3,`튜브는 부력, 나머지는 탄성력이다.`);
m(`지구에서 어떤 물체를 용수철에 매달았더니 12cm 늘어났다. 이 물체를 달에서 같은 용수철에 매달면 몇 cm 늘어나는가?`,[`0cm`,`2cm`,`6cm`,`12cm`,`72cm`],2,`달에서 무게가 1/6이 되므로 늘어난 길이도 1/6 → 2cm`);
m(`비탈면(빗면) 위에 나무 도막이 미끄러지지 않고 정지해 있다. 나무 도막에 작용하는 마찰력의 방향은?`,[`빗면 아래쪽`,`빗면 위쪽`,`연직 아래쪽`,`연직 위쪽`,`마찰력은 없다.`],2,`나무 도막은 빗면 아래로 미끄러지려 하므로 마찰력은 반대인 빗면 위쪽으로 작용한다.`);
m(`화살표 1cm가 5N을 나타낸다. 힘 A는 오른쪽으로 2cm, 힘 B는 왼쪽으로 4cm인 화살표로 나타냈다. 옳은 것은?`,[`A가 B보다 크다.`,`B의 크기는 20N이다.`,`A와 B의 방향은 같다.`,`A의 크기는 20N이다.`,`B의 크기는 10N이다.`],2,`A = 2×5 = 10N(오른쪽), B = 4×5 = 20N(왼쪽)`);
m(`무게와 질량에 대한 설명으로 옳은 것을 모두 고른 것은?`+B([`ㄱ. 우주 정거장 안에서 떠다니는 우주인도 질량이 있다.`,`ㄴ. 같은 물체라도 지구와 달에서 무게가 다르다.`,`ㄷ. 용수철저울로는 질량을 측정한다.`,`ㄹ. 무게의 단위는 N이다.`]),[`ㄱ, ㄴ`,`ㄷ, ㄹ`,`ㄱ, ㄴ, ㄷ`,`ㄱ, ㄴ, ㄹ`,`ㄴ, ㄷ, ㄹ`],4,`용수철저울은 무게를 잰다. 질량은 어디서나 변하지 않으므로 우주 정거장에서도 그대로이다.`);
m(`용수철에 너무 무거운 추를 매달았더니, 추를 떼어 내도 용수철이 원래 길이로 돌아오지 않았다. 그 까닭으로 옳은 것은?`,[`탄성 한계를 넘어서 변형되었기 때문이다.`,`중력이 사라졌기 때문이다.`,`마찰력이 커졌기 때문이다.`,`부력이 작용했기 때문이다.`,`용수철의 질량이 줄었기 때문이다.`],1,`탄성체는 일정한 한계(탄성 한계)를 넘어 변형되면 원래대로 돌아오지 못한다.`);
m(`지구에서 무게가 588N인 우주인의 질량과 달에서의 무게는? (단, 질량 1kg의 무게는 9.8N)`,[`60kg, 98N`,`60kg, 588N`,`10kg, 98N`,`588kg, 98N`,`60kg, 3528N`],1,`질량 = 588 ÷ 9.8 = 60kg, 달 무게 = 588 ÷ 6 = 98N`);
m(`물 위에 떠 있는 배에 짐을 더 실었더니 배가 더 깊이 잠겼지만 여전히 떠 있다. 이에 대한 설명으로 옳은 것은?`,[`배가 받는 부력이 줄었다.`,`배가 받는 부력이 커졌다.`,`배가 받는 부력은 변하지 않았다.`,`배에 작용하는 중력이 줄었다.`,`배가 받는 부력은 0이 되었다.`],2,`떠 있으면 부력=중력이다. 짐을 실어 중력이 커졌으므로 부력도 커졌고, 그래서 더 깊이(더 많은 부피가) 잠긴다.`);
m(`같은 나무 도막을 유리판(A)과 사포(B) 위에서 용수철저울로 끌었다. 움직이기 시작하는 순간 저울 눈금은 A 2N, B 5N이었다. 옳은 해석은?`,[`B의 접촉면이 더 거칠기 때문이다.`,`A에서 마찰력이 더 크다.`,`나무 도막의 무게가 달라졌기 때문이다.`,`접촉면의 넓이가 다르기 때문이다.`,`마찰력은 접촉면과 관계없다.`],1,`같은 물체이므로 무게는 같다. 사포가 더 거칠어서 마찰력이 크다.`);
m(`열기구가 떠오르는 동안 열기구에 작용하는 힘에 대한 설명으로 옳은 것은?`,[`부력이 열기구 전체에 작용하는 중력보다 크다.`,`탄성력 때문에 떠오른다.`,`마찰력이 중력보다 크다.`,`중력이 위쪽으로 작용한다.`,`부력이 아래쪽으로 작용한다.`],1,`위로 작용하는 부력이 아래로 작용하는 중력보다 클 때 떠오른다.`);
m(`다음 중 물체끼리 접촉하지 않아도 작용하는 힘은?`,[`마찰력`,`탄성력`,`중력`,`부력`,`손으로 미는 힘`],3,`중력은 떨어져 있어도 작용한다. 부력은 물이나 공기와 닿아 있어야 작용한다.`);
s(`윗접시저울로 측정한 물체의 질량이 지구와 달에서 같은 까닭을 설명하시오.`,`윗접시저울은 물체와 분동을 비교하여 재는데, 달에서는 물체와 분동에 작용하는 중력이 똑같이 1/6로 줄어들어 균형이 그대로 유지되기 때문이다.`,`'양쪽 중력이 똑같이 줄어든다(비교한다)'는 내용이 핵심`);
s(`표는 용수철에 매단 추의 무게와 늘어난 길이를 나타낸 것이다.`+T([[`추의 무게(N)`,0,5,10,15],[`늘어난 길이(cm)`,0,2,4,6]])+`(1) 무게와 늘어난 길이의 관계를 쓰시오. (2) 12.5N짜리 추를 매달면 몇 cm 늘어나는가?`,`(1) 늘어난 길이는 매단 추의 무게에 비례한다. (2) 5cm`,`5N당 2cm → 12.5N은 2.5배 → 5cm`);
s(`무거운 상자를 밀었는데 움직이지 않았다. 그 까닭을 힘을 이용하여 설명하시오.`,`미는 힘과 같은 크기의 마찰력이 반대 방향으로 작용하기 때문이다.`,`'같은 크기', '반대 방향' 모두 써야 한다.`);
s(`겨울철 눈길에서 자동차 바퀴에 체인을 감는 까닭을 쓰고, 같은 원리를 이용하는 예를 한 가지 쓰시오.`,`마찰력을 크게 하여 미끄러지지 않게 하기 위해서이다. 예: 빙판길에 모래 뿌리기, 등산화 바닥의 홈, 미끄럼 방지 매트 등`,``);
s(`물속에서 무거운 돌을 들면 공기 중에서보다 가볍게 느껴진다. 그 까닭을 쓰시오.`,`물속에서는 돌에 위쪽으로 부력이 작용하기 때문이다.`,`'부력'과 방향(위쪽)이 들어가면 정답`);
s(`지구에서 가정용 체중계로 몸무게가 48kg으로 나오는 학생이 달에서 같은 체중계에 올라가면 약 몇 kg으로 표시될지 쓰고, 이 학생의 실제 질량은 변하는지 설명하시오. (체중계는 용수철의 원리를 이용한다.)`,`약 8kg으로 표시된다. 체중계는 무게(중력)를 재는 도구라 달에서는 1/6로 표시되지만, 실제 질량은 48kg 그대로 변하지 않는다.`,`체중계는 kg으로 표시되지만 실제로는 무게를 재는 도구이다.`);
s(`물 위에 정지해 떠 있는 물체에 중력 6N이 작용하고 있다. 화살표 1cm가 2N을 나타낼 때, 이 물체에 작용하는 두 힘을 화살표로 나타내는 방법을 쓰시오.`,`중력은 물체의 중심에서 아래쪽으로 3cm, 부력은 위쪽으로 3cm 화살표로 나타낸다.`,`떠서 정지해 있으므로 부력 = 중력 = 6N`);
s(`원래 길이가 15cm인 용수철에 4N짜리 추를 매달았더니 전체 길이가 17cm가 되었다. 용수철의 전체 길이를 23cm로 만들려면 몇 N짜리 추를 매달아야 하는가?`,`16N`,`4N당 2cm 늘어남. 23−15 = 8cm 늘려야 하므로 4N × 4 = 16N`);
s(`공기 중 무게가 30N인 물체를 물에 절반 잠기게 했더니 저울 눈금이 26N이었다. 완전히 잠기게 하면 저울 눈금은 얼마가 되는가?`,`22N`,`절반일 때 부력 4N → 완전히 잠기면 부력 8N → 30 − 8 = 22N`);
s(`마찰력이 없다면 우리 생활에서 생길 수 있는 일을 두 가지 쓰시오.`,`걸을 수 없다, 연필로 글씨를 쓸 수 없다, 자동차가 멈추지 못한다, 물건을 손으로 잡을 수 없다 등에서 2가지`,``);
s(`수영장에서 구명조끼를 입으면 몸이 물에 잘 뜨는 까닭을 쓰시오.`,`구명조끼는 가벼우면서 부피가 커서, 물에 잠기는 부피가 늘어나 부력이 커지기 때문이다.`,`'부력이 커진다'가 핵심`);
s(`나무 도막 위에 추를 1개, 2개, 3개 올리며 움직이기 시작하는 순간의 용수철저울 눈금을 측정했더니 2N, 4N, 6N이었다. 이 실험의 결론을 쓰시오.`,`물체의 무게가 클수록 마찰력이 크다. (무게가 2배, 3배가 되면 마찰력도 2배, 3배가 된다.)`,``);
s(`활시위를 더 많이 당길수록 화살이 더 멀리 날아가는 까닭을 쓰시오.`,`활이 더 많이 변형될수록 탄성력이 커지기 때문이다.`,``);
s(`지구에서 무게가 294N인 물체의 질량과, 이 물체를 달에 가져갔을 때의 질량과 무게를 각각 쓰시오. (단, 질량 1kg의 무게는 9.8N)`,`지구 질량 30kg, 달 질량 30kg, 달 무게 49N`,`294 ÷ 9.8 = 30kg, 294 ÷ 6 = 49N`);
s(`워터파크 미끄럼틀에 물을 계속 흘려보내는 까닭을 쓰시오.`,`접촉면의 마찰력을 줄여 잘 미끄러지게 하기 위해서이다.`,``);
s(`테니스공이 라켓에 맞는 순간 찌그러지면서 날아가는 방향이 바뀌었다. 이 상황에서 힘에 의해 나타난 변화를 모두 쓰시오.`,`모양의 변화(공이 찌그러짐)와 운동 상태의 변화(방향이 바뀜)가 함께 나타났다.`,`두 가지가 함께 나타날 수도 있다.`);
s(`정지해 있는 냉장고를 처음에 10N, 다음에 30N의 힘으로 밀었으나 둘 다 움직이지 않았다. 각 경우 냉장고에 작용한 마찰력의 크기와 방향을 쓰시오.`,`10N으로 밀 때 마찰력 10N, 30N으로 밀 때 마찰력 30N이며, 방향은 모두 미는 방향과 반대이다.`,`움직이지 않는 동안 마찰력은 미는 힘과 크기가 같다.`);
s(`헬륨 풍선의 줄을 놓으면 위로 떠오르는 까닭을 힘의 크기를 비교하여 쓰시오.`,`풍선에 위로 작용하는 부력이 아래로 작용하는 중력(풍선의 무게)보다 크기 때문이다.`,``);
s(`지구에서 24N인 물체를 용수철에 매달았더니 12cm 늘어났다. 달에서 이 물체의 무게와, 같은 용수철이 늘어나는 길이를 각각 쓰시오.`,`무게 4N, 늘어난 길이 2cm`,`무게와 늘어난 길이 모두 1/6`);
s(`손으로 용수철을 아래쪽으로 눌렀다. 용수철의 탄성력은 어느 방향으로 작용하며, 그 크기는 손이 누르는 힘과 어떤 관계인지 쓰시오.`,`위쪽(손을 밀어내는 방향)으로 작용하며, 크기는 손이 누르는 힘과 같다.`,`탄성력은 작용한 힘과 크기가 같고 방향이 반대`);

u='F';l=5;
m(`용수철 A는 2N마다 1cm, 용수철 B는 2N마다 2cm씩 늘어난다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 같은 무게의 추를 매달면 B가 더 많이 늘어난다.`,`ㄴ. A를 4cm 늘이려면 8N짜리 추가 필요하다.`,`ㄷ. B에 5N짜리 추를 매달면 5cm 늘어난다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],5,`A: 1N당 0.5cm → 4cm는 8N. B: 1N당 1cm → 5N이면 5cm. 모두 옳다.`);
m(`지구에서 질량이 12kg인 물체를 달에서 용수철저울로 측정하면 눈금은? (단, 지구에서 질량 1kg의 무게는 9.8N)`,[`2kg`,`19.6N`,`117.6N`,`12N`,`705.6N`],2,`지구 무게 12×9.8=117.6N → 달에서 1/6 → 19.6N. 용수철저울은 무게(N)를 잰다.`);
m(`표는 어떤 물체를 물에 넣으며 용수철저울 눈금을 측정한 결과이다.`+T([[`잠긴 정도`,`공기 중`,`1/3`,`2/3`,`완전히`],[`저울 눈금(N)`,15,13,11,9]])+`옳은 것을 모두 고른 것은?`+B([`ㄱ. 잠긴 부피가 클수록 부력이 커진다.`,`ㄴ. 완전히 잠겼을 때 부력은 9N이다.`,`ㄷ. 완전히 잠긴 뒤 더 깊이 넣어도 눈금은 9N이다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄱ, ㄷ`,`ㄱ, ㄴ, ㄷ`],4,`완전히 잠겼을 때 부력 = 15 − 9 = 6N이다. 9N은 물속 무게(저울 눈금)이다.`);
m(`표는 나무 도막을 끌 때 움직이기 시작하는 순간의 용수철저울 눈금(N)이다.`+T([[`접촉면`,`추 0개`,`추 1개`,`추 2개`],[`유리`,1,2,3],[`나무`,2,4,6],[`사포`,4,8,12]])+`이 실험 결과로 알 수 <u>없는</u> 것은?`,[`사포에서 마찰력이 가장 크다.`,`올린 추가 많을수록 마찰력이 크다.`,`나무판에서 추 2개를 올리면 마찰력은 6N이다.`,`유리판에서 추 3개를 올리면 마찰력은 약 4N일 것이다.`,`접촉면이 넓을수록 마찰력이 크다.`],5,`이 실험에서는 접촉면의 넓이를 바꾸지 않았으므로 넓이와의 관계는 알 수 없다(실제로도 관계없다).`);
m(`무게가 5N인 책을 손으로 벽에 수평으로 눌러 떨어지지 않게 하고 있다. 책에 작용하는 마찰력의 방향과 크기는?`,[`아래쪽, 5N`,`위쪽, 5N`,`위쪽, 누르는 힘과 같은 크기`,`마찰력은 0이다.`,`벽 쪽, 5N`],2,`책은 중력 때문에 아래로 떨어지려 하므로 마찰력은 위쪽으로, 중력(5N)과 같은 크기로 작용한다.`);
m(`중력이 지구의 2배인 가상의 행성 X가 있다. 지구에서 질량 10kg(무게 98N)인 물체를 행성 X로 가져갔을 때 옳은 것을 모두 고른 것은?`+B([`ㄱ. X에서 질량은 20kg이다.`,`ㄴ. X에서 무게는 196N이다.`,`ㄷ. X에서 윗접시저울로 재면 10kg이다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],4,`질량은 변하지 않고(10kg), 무게만 2배(196N)가 된다.`);
m(`원래 길이가 8cm인 용수철에 4N을 매달면 전체 길이가 10cm, 8N을 매달면 12cm가 된다. 전체 길이가 15cm가 되려면 몇 N을 매달아야 하는가?`,[`7N`,`12N`,`14N`,`15N`,`30N`],3,`4N당 2cm(1N당 0.5cm). 15−8 = 7cm 늘어나야 하므로 7 ÷ 0.5 = 14N`);
m(`지구에서 6N짜리 추를 매달면 3cm 늘어나는 용수철이 있다. 달에서 어떤 물체를 이 용수철에 매달았더니 3cm 늘어났다. 이 물체의 지구에서의 무게는?`,[`1N`,`6N`,`18N`,`36N`,`3N`],4,`달에서 3cm 늘어났으므로 달에서의 무게는 6N → 지구 무게는 6배인 36N`);
m(`수평면에서 손을 떠난 공이 오른쪽으로 굴러가다가 점점 느려지고 있다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 공에는 왼쪽으로 마찰력이 작용한다.`,`ㄴ. 공에는 지구 중심 방향으로 중력이 작용한다.`,`ㄷ. 공이 굴러가는 동안 오른쪽으로 미는 힘이 계속 작용한다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`손을 떠난 뒤에는 오른쪽으로 미는 힘이 없다. 운동 방향과 반대인 마찰력 때문에 느려진다.`);
m(`무게가 8N인 나무토막 위에 2N짜리 추를 올려놓았더니, 나무토막이 조금 더 잠겼지만 여전히 물 위에 떠 있다. 이때 나무토막이 받는 부력은?`,[`2N`,`6N`,`8N`,`10N`,`16N`],4,`떠 있으면 부력 = 전체 중력 = 8 + 2 = 10N`);
m(`마찰력의 크기와 접촉면의 넓이의 관계를 알아보는 실험을 할 때, 다르게 해야 할 조건은?`,[`나무 도막의 무게`,`접촉면의 거칠기`,`접촉면의 넓이`,`당기는 방향`,`용수철저울의 종류`],3,`알아보려는 조건(넓이)만 다르게 하고 나머지는 모두 같게 해야 한다.`);
m(`화살표 1cm가 4N을 나타낸다. 물 위에 정지해 떠 있는 물체에 작용하는 중력을 아래쪽 5cm 화살표로 나타냈다. 부력을 나타내는 화살표로 옳은 것은?`,[`위쪽 4cm`,`위쪽 5cm`,`아래쪽 5cm`,`위쪽 20cm`,`아래쪽 20cm`],2,`떠서 정지해 있으므로 부력 = 중력 = 20N → 위쪽 5cm`);
m(`다음 중 마찰력을 크게 하는 예만을 모두 고른 것은?`+B([`ㄱ. 스키 바닥에 왁스를 칠한다.`,`ㄴ. 야구 배트 손잡이에 테이프를 감는다.`,`ㄷ. 자전거 브레이크를 잡아 멈춘다.`,`ㄹ. 자기 부상 열차가 선로 위에 떠서 달린다.`,`ㅁ. 신발 밑창에 홈을 판다.`]),[`ㄱ, ㄹ`,`ㄴ, ㄷ`,`ㄴ, ㄷ, ㅁ`,`ㄱ, ㄴ, ㄷ`,`ㄷ, ㄹ, ㅁ`],3,`ㄱ과 ㄹ은 마찰력을 줄이는 예이다.`);
m(`어떤 용수철에 추 A를 매달면 4cm, 추 B를 매달면 6cm 늘어난다. 추 A의 무게가 8N일 때 옳은 것을 모두 고른 것은?`+B([`ㄱ. A와 B를 함께 매달면 10cm 늘어난다.`,`ㄴ. B의 무게는 12N이다.`,`ㄷ. B는 A보다 질량이 작다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`1cm당 2N → B는 12N. 무게가 크면 질량도 크다.`);
m(`공기 중 무게가 똑같이 20N인 물체 A, B를 물에 완전히 넣었더니 저울 눈금이 A는 15N, B는 12N이었다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. B가 받는 부력은 8N이다.`,`ㄴ. A가 받는 부력은 B보다 작다.`,`ㄷ. 물에 잠긴 부피는 B가 더 크다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],5,`A 부력 5N, B 부력 8N. 잠긴 부피가 클수록 부력이 크므로 B의 부피가 더 크다.`);
m(`지구에서 질량이 900kg인 탐사 로봇을 달에 보냈다. 달에서 이 로봇의 무게는? (단, 지구에서 질량 1kg의 무게는 9.8N)`,[`150kg`,`1470N`,`8820N`,`900N`,`5292N`],2,`지구 무게 900×9.8 = 8820N → 달 8820÷6 = 1470N`);
m(`눈 쌓인 길에서 미끄러져 넘어진 상황에 대한 설명으로 옳은 것을 모두 고른 것은?`+B([`ㄱ. 눈길이 미끄러운 것은 마찰력이 작기 때문이다.`,`ㄴ. 넘어질 때 땅으로 떨어지는 것은 중력 때문이다.`,`ㄷ. 넘어지며 눌린 엉덩이 쿠션이 다시 부풀어 오르는 것은 부력 때문이다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`ㄷ은 탄성력 때문이다.`);
m(`용수철 A는 10N에 5cm, 용수철 B는 10N에 2cm 늘어난다. 두 용수철을 각각 4cm씩 늘이는 데 필요한 힘은?`,[`A 8N, B 20N`,`A 20N, B 8N`,`A 8N, B 8N`,`A 4N, B 10N`,`A 2N, B 5N`],1,`A: 1cm당 2N → 8N, B: 1cm당 5N → 20N`);
m(`같은 상자를 (가) 5N, (나) 10N의 힘으로 밀었으나 두 경우 모두 움직이지 않았다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. (가)에서 마찰력은 5N이다.`,`ㄴ. (나)의 마찰력은 (가)의 2배이다.`,`ㄷ. 상자의 무게가 같으므로 두 경우 마찰력의 크기는 같다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`정지해 있는 동안 마찰력은 미는 힘과 크기가 같다.`);
m(`지구에서 용수철저울로 잰 무게가 49N인 물체를 달에서 윗접시저울에 올렸다. 균형을 맞추는 데 필요한 분동의 질량은? (단, 지구에서 질량 1kg의 무게는 9.8N)`,[`약 0.8kg`,`5kg`,`30kg`,`49kg`,`8.2N`],2,`질량 = 49 ÷ 9.8 = 5kg. 윗접시저울은 어디서나 질량을 잰다.`);
s(`표는 용수철에 매단 추의 무게와 늘어난 길이를 나타낸 것이다.`+T([[`추의 무게(N)`,0,3,6,9],[`늘어난 길이(cm)`,0,2,4,6]])+`(1) 추의 무게와 늘어난 길이의 관계를 쓰시오. (2) 7.5N짜리 추를 매달 때 늘어난 길이를 풀이 과정과 함께 구하시오. (3) 이 원리를 이용한 측정 도구를 쓰시오.`,`(1) 비례한다. (2) 3N당 2cm → 7.5N은 2.5배 → 5cm (3) 용수철저울`,`(1) 1점 (2) 풀이+답 2점 (3) 1점`);
s(`어떤 물체의 공기 중 무게는 18N, 물에 절반 잠기면 15N, 완전히 잠기면 12N이었다. (1) 완전히 잠겼을 때 부력은? (2) 이 결과로 알 수 있는 부력의 성질은? (3) 완전히 잠긴 뒤 더 깊이 넣으면 저울 눈금은 어떻게 되는가?`,`(1) 6N (2) 물에 잠긴 부피가 클수록 부력이 커진다. (3) 12N으로 일정하다.`,``);
s(`질량이 30kg인 학생의 (1) 지구에서의 무게 (2) 달에서의 무게 (3) 달에서의 질량을 쓰고, (4) 달에서 몸이 가볍게 느껴지는 까닭을 쓰시오. (단, 질량 1kg의 무게는 9.8N)`,`(1) 294N (2) 49N (3) 30kg (4) 달의 중력이 지구의 약 1/6이어서 무게가 작아지기 때문이다.`,``);
s(`'접촉면의 거칠기에 따른 마찰력 크기 비교 실험'을 설계하려고 한다. (1) 같게 해야 할 조건 2가지 (2) 다르게 해야 할 조건 (3) 마찰력을 측정하는 방법을 쓰시오.`,`(1) 나무 도막의 무게, 접촉면의 넓이(같은 면), 당기는 방법 등에서 2가지 (2) 접촉면의 재질(거칠기) (3) 용수철저울로 나무 도막을 수평으로 끌어 움직이기 시작하는 순간의 눈금을 읽는다.`,``);
s(`무게가 6N인 책을 손으로 벽에 20N의 힘으로 눌러 정지시켰다. 책에 작용하는 마찰력의 크기와 방향을 쓰고, 그렇게 판단한 까닭을 쓰시오.`,`위쪽으로 6N. 책은 중력(6N) 때문에 아래로 떨어지려 하는데 정지해 있으므로, 이와 같은 크기의 마찰력이 반대 방향(위쪽)으로 작용한다.`,`누르는 힘 20N은 마찰력의 크기와 같지 않다는 점이 함정`);
s(`트램펄린에서 뛰는 사람에게 작용하는 힘을 두 가지 이상 찾아 각각의 방향과 함께 설명하시오.`,`중력: 항상 지구 중심 방향(아래쪽)으로 작용한다. 탄성력: 트램펄린이 아래로 눌렸을 때 사람을 위쪽으로 밀어 올린다.`,``);
s(`배가 물 위에 뜰 수 있는 까닭을 쓰고, 짐을 많이 실은 배가 더 깊이 잠기는 까닭을 설명하시오.`,`배에 작용하는 부력과 중력의 크기가 같기 때문에 뜬다. 짐을 실으면 중력이 커지므로, 그만큼 부력이 커지도록 더 많은 부피가 물에 잠긴다.`,``);
s(`겨울철 빙판길에서 안전하게 다니기 위한 방법 두 가지와 그 원리를 쓰시오.`,`모래 뿌리기, 자동차 체인·스노타이어, 미끄럼 방지 신발 등. 원리: 접촉면을 거칠게 하여 마찰력을 크게 한다.`,``);
s(`원래 길이 12cm인 용수철에 6N짜리 추를 매달면 전체 길이가 15cm가 된다. (1) 1N당 늘어나는 길이 (2) 전체 길이가 20cm일 때 매단 물체의 무게 (3) 지구에서 48N인 물체를 달에서 매달 때 용수철의 전체 길이를 구하시오.`,`(1) 0.5cm (2) 16N (3) 16cm`,`(3) 달 무게 8N → 4cm 늘어남 → 12 + 4 = 16cm`);
s(`무게가 5N인 나무토막이 물 위에 정지해 떠 있다. 나무토막에 작용하는 힘의 종류, 방향, 크기를 모두 쓰고, 화살표 1cm가 1N일 때 화살표로 나타내는 방법을 쓰시오.`,`중력: 아래쪽 5N → 아래로 5cm, 부력: 위쪽 5N → 위로 5cm (작용점은 나무토막의 중심)`,``);
s(`자전거에서 마찰력을 크게 이용하는 곳과 작게 이용하는 곳을 각각 2가지씩 쓰시오.`,`크게: 브레이크, 타이어 무늬, 손잡이 고무, 페달 표면 / 작게: 체인의 윤활유, 바퀴 축의 볼베어링`,``);
s(`무게가 같은 상자 A(바닥이 매끈함)와 상자 B(바닥이 거침)를 같은 바닥에서 같은 힘으로 밀 때, 어느 상자가 더 쉽게 움직이는지 쓰고 그 까닭을 설명하시오.`,`A. 접촉면이 매끈할수록 마찰력이 작기 때문이다.`,``);
s(`질량 3kg인 물체를 지구와 달에서 윗접시저울과 용수철저울로 측정하였다. 표의 빈칸을 채우시오. (단, 지구에서 질량 1kg의 무게는 10N으로 계산한다.)`+T([[``,`윗접시저울`,`용수철저울`],[`지구`,`( ㉠ )`,`( ㉡ )`],[`달`,`( ㉢ )`,`( ㉣ )`]]),`㉠ 3kg ㉡ 30N ㉢ 3kg ㉣ 5N`,`질량은 그대로, 무게만 1/6`);
s(`수영장 물속에서 걸으면 몸이 가볍게 느껴진다. 이때 몸의 질량과 몸에 작용하는 중력은 변했는지 설명하시오.`,`질량과 중력은 변하지 않는다. 다만 위쪽으로 부력이 함께 작용하여 가볍게 느껴지는 것이다.`,`'부력이 생겨서 중력이 줄었다'는 틀린 표현`);
s(`장대높이뛰기 선수가 (가) 장대를 꽂아 장대가 크게 휘어짐 → (나) 휘어진 장대가 펴지며 선수가 올라감 → (다) 바를 넘어 떨어짐 → (라) 매트에 떨어진 뒤 매트가 원래대로 돌아옴. 각 과정에서 중요한 힘을 쓰시오.`,`(가)·(나) 탄성력, (다) 중력, (라) 탄성력`,``);
s(`열기구가 떠오를 때와, 일정한 높이에 머물러 있을 때 부력과 중력의 크기를 각각 비교하시오.`,`떠오를 때: 부력 > 중력, 일정한 높이에 머물 때: 부력 = 중력`,``);
s(`용수철저울로 물체의 무게를 측정하는 원리를 '탄성력'과 '중력'이라는 단어를 사용하여 설명하시오.`,`물체에 작용하는 중력만큼 용수철이 늘어나고, 이때 용수철의 탄성력이 중력과 같은 크기로 물체를 당긴다. 늘어난 길이는 무게에 비례하므로 눈금으로 무게를 읽는다.`,``);
s(`다음 현상에 작용하는 힘의 종류를 각각 쓰시오. (가) 고드름이 아래로 자란다 (나) 활을 쏜다 (다) 비누칠을 하면 손가락의 반지가 잘 빠진다 (라) 물속에서 돌이 가볍게 느껴진다`,`(가) 중력 (나) 탄성력 (다) 마찰력(마찰력이 줄어듦) (라) 부력`,``);
s(`공기 중 무게가 32N인 물체가 물에 완전히 잠기면 저울 눈금이 24N이 된다. 이 물체의 1/4만 물에 잠기게 하면 저울 눈금은 얼마인지 풀이 과정과 함께 쓰시오.`,`완전히 잠겼을 때 부력 8N → 1/4 잠기면 부력 2N → 32 − 2 = 30N`,``);
s(`마찰력이 꼭 필요한 상황과 마찰력이 오히려 불편한 상황을 각각 하나씩 쓰고, 마찰력을 조절하는 방법을 쓰시오.`,`필요한 상황: 걷기, 자동차 브레이크 등 → 접촉면을 거칠게 한다. 불편한 상황: 무거운 짐 옮기기, 기계 부품 마모 등 → 윤활유, 바퀴, 볼베어링을 사용한다.`,``);

u='F';l=9;
m(`지구에서 3N의 힘에 2cm씩 늘어나는 용수철 A가 있다. 지구에서 질량이 1.8kg인 물체를 달에서 용수철 A에 매달면 늘어난 길이는? (단, 지구에서 질량 1kg의 무게는 10N으로 계산한다.)`,[`1cm`,`2cm`,`3cm`,`6cm`,`12cm`],2,`지구 무게 18N → 달 무게 3N → 2cm`);
m(`2N마다 1cm씩 늘어나는 용수철에 물체를 매달았더니 공기 중에서는 6cm, 물에 완전히 잠기게 하면 4.5cm 늘어났다. 이 물체가 받는 부력은?`,[`1.5N`,`3N`,`4.5N`,`6N`,`9N`],2,`공기 중 12N, 물속 9N → 부력 3N`);
m(`부피가 같은 물체 A, B가 있다. A의 공기 중 무게는 20N, B는 30N이다. A를 물에 완전히 넣었더니 저울 눈금이 14N이었다면, B를 물에 완전히 넣었을 때 저울 눈금은?`,[`14N`,`20N`,`24N`,`30N`,`36N`],3,`부피가 같으면 완전히 잠겼을 때 부력도 같다(6N). B: 30 − 6 = 24N`);
m(`바닥에 놓인 상자를 철수는 오른쪽으로 8N, 영희는 왼쪽으로 3N의 힘으로 동시에 밀었는데 상자가 움직이지 않았다. 상자에 작용하는 마찰력의 크기와 방향은?`,[`3N, 오른쪽`,`5N, 왼쪽`,`5N, 오른쪽`,`8N, 왼쪽`,`11N, 왼쪽`],2,`두 힘을 합치면 오른쪽으로 5N만큼 밀린다. 상자가 정지해 있으므로 마찰력은 왼쪽으로 5N이다.`);
m(`무게가 6N인 나무토막이 물에 떠 있다. 이 나무토막이 완전히 물에 잠길 때 받는 부력은 10N이다. 나무토막 위에 추를 올려 나무토막의 윗면이 수면과 같아지게 하려면 몇 N짜리 추를 올려야 하는가?`,[`4N`,`6N`,`10N`,`16N`,`60N`],1,`윗면이 수면과 같으면 완전히 잠긴 것 → 부력 10N = 나무토막 6N + 추 → 추 4N`);
m(`지구에서 질량 2kg인 물체를 용수철에 매달면 8cm 늘어난다. 가상의 행성 Y에서 같은 물체를 같은 용수철에 매달았더니 2cm 늘어났다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. Y의 중력은 지구의 1/4이다.`,`ㄴ. Y에서 이 물체의 질량은 0.5kg이다.`,`ㄷ. Y에서 이 용수철을 8cm 늘이려면 질량 8kg인 물체가 필요하다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄱ, ㄷ`,`ㄱ, ㄴ, ㄷ`],4,`늘어난 길이가 1/4 → 중력 1/4. 질량은 2kg 그대로. Y에서 4배 무게를 만들려면 질량도 4배인 8kg이 필요하다.`);
m(`정지한 상자를 미는 힘을 0부터 서서히 키웠더니 미는 힘이 7N이 되는 순간 상자가 움직이기 시작했다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 미는 힘이 4N일 때 마찰력은 4N이다.`,`ㄴ. 상자가 정지해 있는 동안 마찰력은 미는 힘과 관계없이 7N으로 일정하다.`,`ㄷ. 상자 위에 같은 상자를 하나 더 올리면 7N보다 큰 힘이 있어야 움직이기 시작한다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄱ, ㄷ`,`ㄱ, ㄴ, ㄷ`],4,`정지해 있는 동안 마찰력은 미는 힘과 같은 크기로 변한다. 무게가 커지면 마찰력도 커진다.`);
m(`무게가 4N인 책을 손으로 벽에 30N의 힘으로 눌러 정지시켰다. 누르는 힘을 50N으로 키워도 책은 그대로 정지해 있다. 이때 책에 작용하는 마찰력은?`,[`위쪽, 4N`,`위쪽, 30N`,`위쪽, 50N`,`아래쪽, 4N`,`0N`],1,`정지해 있으므로 마찰력은 중력(4N)과 같은 크기로 위쪽에 작용한다. 누르는 힘이 커져도 정지해 있다면 마찰력은 4N이다.`);
m(`높이가 10cm인 원기둥을 용수철저울에 매달아 물속으로 내리면서 잠긴 깊이에 따른 눈금을 측정했다. 잠긴 깊이가 0cm일 때 20N이었고, 10cm 이상일 때는 15N으로 일정했다. 잠긴 깊이가 4cm일 때 저울 눈금은?`,[`15N`,`16N`,`18N`,`19N`,`20N`],3,`완전히 잠기면 부력 5N. 4cm 잠기면 잠긴 부피가 4/10 → 부력 2N → 20 − 2 = 18N`);
m(`다음 학생들의 생각 중 옳은 것을 모두 고른 것은?`+B([`ㄱ. 위로 던진 공이 올라가는 동안에는 위쪽으로 힘이 계속 작용한다.`,`ㄴ. 우주 정거장 안의 물체도 질량이 있다.`,`ㄷ. 같은 접촉면에서는 무거운 물체일수록 마찰력이 크다.`,`ㄹ. 물에 가라앉는 물체는 부력을 받지 않는다.`]),[`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄷ, ㄹ`,`ㄱ, ㄹ`,`ㄴ, ㄷ, ㄹ`],2,`ㄱ: 손을 떠난 공에는 중력만 아래로 작용한다. ㄹ: 가라앉는 물체도 부력을 받는다(부력 < 중력일 뿐).`);
m(`원래 길이가 20cm인 용수철에 무게 W인 물체를 지구에서 매달았더니 전체 길이가 26cm였다. 달에서 같은 물체 6개를 한꺼번에 이 용수철에 매달면 전체 길이는?`,[`21cm`,`22cm`,`26cm`,`56cm`,`36cm`],3,`지구에서 1개 6cm → 달에서 1개 1cm → 6개 6cm → 20 + 6 = 26cm`);
m(`완전히 물에 잠긴 잠수함에 대한 설명으로 옳은 것을 모두 고른 것은? (깊이에 따른 물의 변화는 무시한다.)`+B([`ㄱ. 완전히 잠긴 잠수함이 받는 부력은 깊이가 달라져도 일정하다.`,`ㄴ. 물탱크에 물을 채우면 중력이 부력보다 커져 가라앉는다.`,`ㄷ. 물탱크의 물을 빼면 부력이 커져서 떠오른다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`물을 빼면 부력이 커지는 것이 아니라 중력(무게)이 작아져서 부력 > 중력이 된다.`);
m(`화살표 1cm가 3N을 나타낸다. 바닥 위 상자에 오른쪽으로 4cm짜리 화살표만큼의 힘을 주었으나 상자는 정지해 있다. 마찰력을 나타내는 화살표로 옳은 것은?`,[`왼쪽 4cm (12N)`,`오른쪽 4cm (12N)`,`왼쪽 3cm (9N)`,`왼쪽 12cm (36N)`,`화살표를 그릴 수 없다.`],1,`미는 힘 12N과 같은 크기, 반대 방향 → 왼쪽 4cm`);
m(`어떤 물체를 지구에서 용수철저울로 재면 30N, 행성 Z에서 재면 45N이다. 옳은 것을 모두 고른 것은? (단, 지구에서 질량 1kg의 무게는 10N으로 계산한다.)`+B([`ㄱ. 이 물체의 질량은 3kg이다.`,`ㄴ. 행성 Z의 중력은 지구의 1.5배이다.`,`ㄷ. 행성 Z에서 윗접시저울로 재면 4.5kg이다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`질량은 어디서나 3kg이다.`);
m(`무게가 5N인 나무 도막 1개를 사포 위에서 끌면 2N의 힘에서 움직이기 시작한다. 같은 나무 도막 3개를 쌓아 올린 뒤, 좁은 면이 바닥에 닿도록 세워서 같은 사포 위에서 끌면 움직이기 시작하는 힘은?`,[`2N`,`4N`,`6N`,`15N`,`18N`],3,`무게가 3배 → 마찰력 3배 = 6N. 접촉면의 넓이는 관계없다.`);
m(`무게가 0.1N인 헬륨 풍선이 받는 부력은 0.5N이다. 이 풍선에 추를 매달아 공중에 가만히 떠 있게 하려면 몇 N짜리 추를 매달아야 하는가? (추가 받는 부력은 무시한다.)`,[`0.1N`,`0.4N`,`0.5N`,`0.6N`,`0N`],2,`가만히 떠 있으려면 부력 = 전체 무게. 0.5 = 0.1 + 추 → 0.4N`);
m(`표는 어떤 용수철에 추를 매달았을 때 늘어난 길이이다.`+T([[`추의 무게(N)`,2,4,6,8,10],[`늘어난 길이(cm)`,1,2,3,5,8]])+`옳은 것을 모두 고른 것은?`+B([`ㄱ. 6N까지는 무게와 늘어난 길이가 비례한다.`,`ㄴ. 8N부터는 비례 관계가 깨졌다.`,`ㄷ. 이 용수철로 10N의 무게를 정확하게 측정할 수 있다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`비례 관계가 깨진 범위(탄성 한계를 넘을 수 있는 범위)에서는 정확한 측정이 어렵다.`);
m(`물체 A는 공기 중 10N, 물속 6N이고, 물체 B는 공기 중 8N, 물속 7N이다. A와 B를 실로 묶어 함께 물에 완전히 넣으면 저울 눈금은?`,[`5N`,`13N`,`14N`,`18N`,`4N`],2,`전체 무게 18N, 부력 4N + 1N = 5N → 18 − 5 = 13N`);
m(`지구의 어떤 바닥에서 상자를 끌 때 12N의 힘을 주어야 움직이기 시작했다. 달에 같은 재질의 바닥이 있다면, 같은 상자를 움직이기 시작하는 데 필요한 힘은? (마찰력은 물체의 무게에 비례한다고 가정한다.)`,[`0N`,`2N`,`6N`,`12N`,`72N`],2,`달에서는 무게가 1/6 → 마찰력도 1/6 → 2N`);
m(`번지 점프를 하는 사람에 대한 설명으로 옳은 것을 모두 고른 것은?`+B([`ㄱ. 뛰어내리는 순간부터 계속 중력이 작용한다.`,`ㄴ. 줄이 많이 늘어날수록 탄성력이 커진다.`,`ㄷ. 가장 낮은 지점에서는 줄의 탄성력이 0이다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`가장 낮은 지점에서 줄이 가장 많이 늘어나 있으므로 탄성력이 가장 크다.`);
s(`높이 10cm인 원기둥을 물속으로 내리며 저울 눈금을 측정하였다.`+T([[`잠긴 깊이(cm)`,0,2,4,6,8,10,12],[`저울 눈금(N)`,30,28,26,24,22,20,20]])+`(1) 최대 부력의 크기 (2) 10cm 이후 눈금이 일정한 까닭 (3) 잠긴 깊이 5cm일 때의 눈금을 쓰시오.`,`(1) 10N (2) 원기둥이 완전히 잠겨 잠긴 부피가 더 이상 늘지 않으므로 부력이 일정하다. (3) 25N`,`2cm 잠길 때마다 부력 2N씩 증가`);
s(`질량 50kg인 탐사 로봇이 지구, 달, 가상 행성 P(중력이 지구의 0.4배)를 방문한다. 각 장소에서 로봇의 질량과 무게를 쓰고, 로봇의 무게가 가장 작은 곳을 쓰시오. (단, 지구에서 질량 1kg의 무게는 10N으로 계산한다.)`,`질량은 모두 50kg. 무게: 지구 500N, 달 약 83N(500÷6), 행성 P 200N. 가장 작은 곳: 달`,``);
s(`정지한 상자를 미는 힘을 키우면 6N에서 상자가 움직이기 시작한다. 같은 상자를 하나 더 위에 올리면 몇 N에서 움직이기 시작할지 예측하고 그 까닭을 쓰시오.`,`12N. 무게가 2배가 되면 마찰력도 2배로 커지기 때문이다.`,``);
s(`무게 5N인 책을 손으로 벽에 20N의 힘으로 눌러 정지시켰다가, 누르는 힘을 40N으로 키웠다. 마찰력은 어떻게 변하는지 쓰고 그 까닭을 설명하시오.`,`5N으로 변하지 않는다. 책이 정지해 있으려면 마찰력이 책의 무게(중력 5N)와 같아야 하기 때문이다.`,`누르는 힘이 커지면 '버틸 수 있는 최대 마찰력'은 커지지만, 실제로 작용하는 마찰력은 5N이다.`);
s(`용수철 A는 1N에 2cm, 용수철 B는 1N에 0.5cm 늘어난다. (1) 작은 무게를 정밀하게 재는 저울과 (2) 무거운 물체를 재는 저울에 각각 어떤 용수철이 알맞은지 까닭과 함께 쓰시오.`,`(1) A: 작은 힘에도 많이 늘어나 눈금 차이를 정밀하게 읽을 수 있다. (2) B: 큰 힘에도 조금만 늘어나 무거운 물체를 재도 지나치게 늘어나지 않는다.`,``);
s(`배 자체의 무게는 2000N이고, 배가 가라앉기 직전(갑판까지 잠김)에 받을 수 있는 최대 부력은 5000N이다. 이 배에 실을 수 있는 짐의 최대 무게를 쓰고 그 까닭을 설명하시오.`,`3000N. 떠 있으려면 부력이 (배+짐)의 무게와 같아야 하는데, 최대 부력이 5000N이므로 짐은 5000 − 2000 = 3000N까지 실을 수 있다.`,``);
s(`물체 A는 공기 중 12N, 물속 8N이고, 물체 B는 공기 중 6N, 물속 3N이다. 두 물체를 묶어 함께 물속에 완전히 넣었을 때 저울 눈금을 풀이 과정과 함께 구하시오.`,`전체 무게 18N, 부력 합 4 + 3 = 7N → 18 − 7 = 11N`,``);
s(`마찰력 실험에서 한 학생이 용수철저울을 비스듬히 위쪽으로 당겨 측정했다. 이 측정의 문제점과 올바른 방법을 쓰시오.`,`당기는 힘의 일부가 나무 도막을 들어 올리는 데 쓰여 마찰력을 정확하게 잴 수 없다. 용수철저울을 바닥과 수평으로 당겨야 한다.`,``);
s(`지구의 가정용 체중계로 42kg이 표시되는 학생이 있다. (1) 달에서 같은 체중계에 표시되는 값 (2) 달에서 윗접시저울(대형)로 잰 값 (3) 두 값이 다른 까닭을 쓰시오.`,`(1) 7kg (2) 42kg (3) 체중계는 무게(중력)를 재는 도구라 달에서 1/6로 작아지지만, 윗접시저울은 질량을 비교하므로 변하지 않는다.`,``);
s(`물체 A(무게 5N, 완전히 잠길 때 부력 8N), B(무게 10N, 완전히 잠길 때 부력 10N), C(무게 12N, 완전히 잠길 때 부력 4N)를 물에 넣었다. 각 물체가 어떻게 되는지 쓰고, 그때 받는 부력의 크기를 쓰시오.`,`A: 물 위에 떠서 일부만 잠기며 부력 5N. B: 물속 어디에서나 떠 있을 수 있으며 부력 10N. C: 가라앉으며 부력 4N.`,`A는 떠 있으므로 부력이 8N이 아니라 무게와 같은 5N이다.`);
s(`2N마다 1cm 늘어나는 용수철에 물체를 매달았더니 지구의 공기 중에서 12cm, 물에 완전히 잠기면 9cm 늘어났다. (1) 지구에서 물체의 무게 (2) 부력 (3) 달의 공기 중에서 매달 때 늘어나는 길이를 구하시오.`,`(1) 24N (2) 6N (3) 2cm`,`달 무게 4N → 2cm`);
s(`무게 6N인 공을 손으로 4N의 힘을 주어 아래로 눌러 물속에 완전히 잠긴 채 정지시켰다. 이때 공이 받는 부력의 크기를 구하고, 화살표 1cm가 2N일 때 부력을 화살표로 나타내는 방법을 쓰시오.`,`부력 10N(중력 6N + 누르는 힘 4N), 위쪽으로 5cm 화살표`,`정지해 있으므로 위로 작용하는 힘 = 아래로 작용하는 힘의 합`);
s(`무거운 냉장고를 혼자 옮겨야 한다. 힘을 적게 들이고 옮기는 방법을 두 가지 제안하고 각각의 원리를 쓰시오.`,`① 바퀴 달린 받침대에 올려 옮긴다 → 굴러가게 하여 마찰력을 줄인다. ② 바닥에 매끄러운 천이나 판을 깔고 민다 → 접촉면을 매끄럽게 해 마찰력을 줄인다. (짐을 빼서 무게를 줄이는 것도 가능)`,``);
s(`트램펄린을 더 깊이 누를수록 더 높이 튀어 오른다. 그 까닭을 탄성력의 크기와 변형 정도의 관계를 이용해 설명하시오.`,`탄성체는 많이 변형될수록 탄성력이 커진다. 깊이 누를수록 트램펄린이 많이 변형되어 큰 탄성력이 위쪽으로 작용하므로 더 높이 튀어 오른다.`,``);
s(`표는 어떤 용수철의 실험 결과이다.`+T([[`추의 무게(N)`,2,4,6,8,10],[`늘어난 길이(cm)`,1,2,3,4.5,7]])+`이 용수철로 용수철저울을 만든다면 측정할 수 있는 범위를 정하고 그 까닭을 쓰시오.`,`0~6N. 6N까지만 무게와 늘어난 길이가 비례하므로 눈금을 일정한 간격으로 매길 수 있기 때문이다.`,``);
s(`지구에서 갑자기 마찰력이 사라진다면 생길 수 있는 문제점 3가지와 좋은 점 1가지를 쓰시오.`,`문제점: 걸을 수 없다, 자동차가 멈추지 못한다, 물건을 잡을 수 없다, 못이나 나사가 빠진다 등. 좋은 점: 기계 부품이 닳지 않는다, 무거운 물건을 쉽게 밀 수 있다 등`,``);
s(`무게가 똑같이 20N인 쇠공과 알루미늄 공이 있다. 알루미늄 공이 쇠공보다 부피가 크다. 두 공을 각각 용수철저울에 매달아 물속에 완전히 넣었을 때 어느 쪽 저울 눈금이 더 작을지 쓰고, 그 까닭을 쓰시오. (두 공 모두 물에 가라앉는다.)`,`알루미늄 공. 부피가 더 커서 물에 잠기는 부피가 크므로 부력을 더 많이 받기 때문이다.`,``);
s(`남극에 있는 사람이 공을 놓아도, 북극에 있는 사람이 공을 놓아도 모두 땅으로 떨어진다. 이 현상을 중력의 방향을 이용하여 설명하시오.`,`중력은 지구 어디에서나 지구 중심 방향으로 작용한다. 따라서 어디서 공을 놓아도 공은 지구 중심 쪽, 즉 그 사람의 발밑 땅으로 떨어진다.`,``);
s(`친구가 "나무 도막을 넓은 면으로 눕혀서 끌면 바닥과 닿는 부분이 많아서 마찰력이 더 커"라고 말했다. 이 주장이 옳은지 판단하고, 이를 확인할 실험 방법을 쓰시오.`,`옳지 않다. 마찰력은 접촉면의 넓이와 관계없다. 같은 나무 도막을 같은 바닥에서 넓은 면과 좁은 면으로 각각 놓고 용수철저울로 수평으로 끌어, 움직이기 시작하는 순간의 눈금을 비교하면 같게 나온다.`,``);
s(`열기구를 운행할 때 (1) 더 높이 올라가는 방법 두 가지 (2) 내려오는 방법 한 가지를 부력과 중력의 크기 관계로 설명하시오.`,`(1) 버너로 풍선 속 공기를 더 데우거나, 모래주머니를 버려 열기구 전체의 무게를 줄인다 → 부력 > 중력. (2) 풍선 속 공기를 식혀 부력보다 중력이 커지게 한다.`,`풍선 속 공기가 데워지면 같은 부피의 바깥 공기보다 가벼워진다.`);

u='S';l=1;
m(`물질을 이루는 매우 작은 알갱이를 무엇이라고 하는가?`,[`세포`,`입자`,`에너지`,`빛`,`소리`],2,`물질은 눈에 보이지 않는 매우 작은 입자로 이루어져 있다.`);
m(`향수를 뿌리면 냄새가 방 전체로 퍼진다. 이 현상을 무엇이라고 하는가?`,[`증발`,`확산`,`융해`,`응고`,`액화`],2,`입자가 스스로 운동하여 퍼져 나가는 현상이 확산이다.`);
m(`액체의 표면에서 액체가 기체로 변하는 현상은?`,[`확산`,`증발`,`응고`,`융해`,`승화`],2,`증발은 액체 표면에서 입자가 기체로 날아가는 현상이다.`);
m(`입자의 배열이 규칙적이고, 입자가 제자리에서 진동하는 물질의 상태는?`,[`고체`,`액체`,`기체`,`액체와 기체`,`모든 상태`],1,`고체는 입자가 규칙적으로 빽빽하게 배열되어 있다.`);
m(`모양과 부피가 모두 일정하지 않은 물질의 상태는?`,[`고체`,`액체`,`기체`,`고체와 액체`,`모든 상태`],3,`기체는 담는 그릇에 따라 모양과 부피가 모두 달라진다.`);
m(`고체가 액체로 변하는 현상은?`,[`응고`,`융해`,`기화`,`액화`,`승화`],2,`고체 → 액체: 융해`);
m(`액체가 고체로 변하는 현상은?`,[`응고`,`융해`,`기화`,`액화`,`승화`],1,`액체 → 고체: 응고`);
m(`액체가 기체로 변하는 현상은?`,[`응고`,`융해`,`기화`,`액화`,`확산`],3,`액체 → 기체: 기화 (증발과 끓음이 있다)`);
m(`기체가 액체로 변하는 현상은?`,[`응고`,`융해`,`기화`,`액화`,`승화`],4,`기체 → 액체: 액화`);
m(`고체가 액체를 거치지 않고 바로 기체로 변하는 현상은?`,[`응고`,`융해`,`기화`,`액화`,`승화`],5,`고체 → 기체: 승화`);
m(`얼음이 녹아 물이 되는 상태 변화는?`,[`응고`,`융해`,`기화`,`액화`,`승화`],2,`고체(얼음) → 액체(물): 융해`);
m(`차가운 음료수 컵 표면에 물방울이 맺히는 상태 변화는?`,[`응고`,`융해`,`기화`,`액화`,`승화`],4,`공기 중 수증기가 차가운 컵 표면에서 물방울로 변한다(액화).`);
m(`드라이아이스의 크기가 점점 작아지는 상태 변화는?`,[`응고`,`융해`,`기화`,`액화`,`승화`],5,`드라이아이스(고체)가 바로 이산화 탄소 기체로 변한다.`);
m(`추운 겨울날 유리창 안쪽에 성에가 생기는 상태 변화는?`,[`융해`,`기화`,`액화`,`승화(기체 → 고체)`,`응고`],4,`수증기(기체)가 바로 얼음 알갱이(고체)로 변한다. 교과서에 따라 '증착'이라고도 한다.`);
m(`물질의 상태가 변할 때 변하지 <u>않는</u> 것은?`,[`입자의 배열`,`입자 사이의 거리`,`질량`,`부피`,`입자 운동의 활발한 정도`],3,`상태가 변해도 입자의 종류와 개수는 그대로이므로 질량은 변하지 않는다.`);
m(`열에너지를 흡수하는 상태 변화는?`,[`응고`,`액화`,`융해`,`서리가 생기는 것`,`이슬이 맺히는 것`],3,`융해, 기화, 승화(고체→기체)는 열에너지를 흡수한다.`);
m(`열에너지를 방출하는 상태 변화는?`,[`융해`,`기화`,`승화(고체 → 기체)`,`응고`,`증발`],4,`응고, 액화, 승화(기체→고체)는 열에너지를 방출한다.`);
m(`입자 사이의 거리가 가장 먼 물질의 상태는?`,[`고체`,`액체`,`기체`,`모두 같다.`,`알 수 없다.`],3,`기체는 입자 사이의 거리가 매우 멀다.`);
m(`일정한 모양은 없지만 부피는 일정한 물질의 상태는?`,[`고체`,`액체`,`기체`,`고체와 기체`,`모든 상태`],2,`액체는 담는 그릇에 따라 모양이 바뀌지만 부피는 일정하다.`);
m(`물이 끓고 있는 동안 물의 온도 변화로 옳은 것은?`,[`계속 올라간다.`,`일정하게 유지된다.`,`계속 내려간다.`,`올라가다가 내려간다.`,`불규칙하게 변한다.`],2,`끓는 동안 가해 준 열에너지는 상태 변화에 쓰이므로 온도가 일정하다.`);

m(`확산의 예가 <u>아닌</u> 것은?`,[`꽃향기가 멀리까지 퍼진다.`,`물에 떨어뜨린 잉크가 퍼진다.`,`마약 탐지견이 냄새로 마약을 찾는다.`,`방향제를 두면 방 안에 향기가 퍼진다.`,`젖은 빨래가 마른다.`],5,`젖은 빨래가 마르는 것은 증발이다.`);

m(`고체의 특징으로 옳은 것은?`,[`입자가 자유롭게 이동한다.`,`모양과 부피가 일정하다.`,`압축이 잘 된다.`,`담는 그릇에 따라 모양이 변한다.`,`입자 사이의 거리가 가장 멀다.`],2,`고체는 입자가 규칙적으로 배열되어 있어 모양과 부피가 일정하다.`);
m(`기체의 특징으로 옳은 것은?`,[`부피가 일정하다.`,`입자가 규칙적으로 배열되어 있다.`,`입자가 매우 빠르고 자유롭게 운동하며 압축이 잘 된다.`,`모양이 일정하다.`,`입자가 제자리에서 진동만 한다.`],3,`기체는 입자 사이가 멀어 압축이 잘 된다.`);
m(`융해의 예로 옳은 것은?`,[`아이스크림이 녹는다.`,`고드름이 생긴다.`,`용암이 식어 굳는다.`,`이슬이 맺힌다.`,`서리가 내린다.`],1,`고체 → 액체`);
m(`응고의 예로 옳은 것은?`,[`초가 녹는다.`,`물을 냉동실에 넣어 얼음을 만든다.`,`안경에 김이 서린다.`,`드라이아이스가 작아진다.`,`빨래가 마른다.`],2,`액체 → 고체`);
m(`액화의 예로 옳은 것은?`,[`겨울철 입김이 하얗게 보인다.`,`나프탈렌이 작아진다.`,`얼음이 녹는다.`,`물이 끓는다.`,`촛농이 굳는다.`],1,`입김 속 수증기가 차가운 공기를 만나 작은 물방울로 변한다.`);

m(`기체가 바로 고체로 변하는 예로 옳은 것은?`,[`서리가 생긴다.`,`이슬이 맺힌다.`,`안개가 낀다.`,`주전자 입구에서 김이 생긴다.`,`땀이 마른다.`],1,`수증기가 바로 얼음 알갱이로 변한다.`);
m(`물질의 상태 변화와 입자에 대한 설명으로 옳은 것은?`,[`상태가 변하면 입자의 종류가 바뀐다.`,`상태가 변하면 입자의 개수가 변한다.`,`상태가 변하면 입자의 배열이 바뀐다.`,`상태가 변하면 질량이 늘어난다.`,`상태가 변하면 입자의 크기가 커진다.`],3,`입자의 종류·개수·크기는 그대로이고 배열(거리)만 바뀐다.`);
m(`물이 얼음이 될 때 부피 변화로 옳은 것은?`,[`줄어든다.`,`늘어난다.`,`변하지 않는다.`,`0이 된다.`,`알 수 없다.`],2,`대부분의 물질은 응고할 때 부피가 줄지만, 물은 예외적으로 늘어난다.`);
m(`추운 겨울에 수도관이 터지는 까닭으로 옳은 것은?`,[`물이 얼면서 부피가 늘어나기 때문이다.`,`물이 얼면서 질량이 늘어나기 때문이다.`,`물이 증발하기 때문이다.`,`수도관이 녹기 때문이다.`,`물이 얼면서 부피가 줄기 때문이다.`],1,`물은 얼 때 부피가 늘어나 수도관을 밀어낸다. 질량은 변하지 않는다.`);
m(`녹인 촛농이 굳으면 가운데가 오목하게 들어간다. 그 까닭은?`,[`응고하면서 부피가 줄었기 때문이다.`,`응고하면서 질량이 줄었기 때문이다.`,`응고하면서 부피가 늘었기 때문이다.`,`촛농이 증발했기 때문이다.`,`입자의 개수가 줄었기 때문이다.`],1,`대부분의 물질은 액체 → 고체로 될 때 부피가 줄어든다.`);
m(`주사를 맞기 전 알코올 솜으로 피부를 닦으면 시원하게 느껴지는 까닭은?`,[`알코올이 증발하면서 열에너지를 흡수하기 때문이다.`,`알코올이 응고하면서 열에너지를 방출하기 때문이다.`,`알코올이 액화하면서 열에너지를 흡수하기 때문이다.`,`알코올이 확산되기 때문이다.`,`알코올이 피부 속으로 들어가기 때문이다.`],1,`기화(증발)할 때 주위의 열에너지를 흡수하므로 시원하다.`);
m(`에스키모가 이글루 안에 물을 뿌리면 실내가 따뜻해지는 까닭은?`,[`물이 얼면서 열에너지를 방출하기 때문이다.`,`물이 얼면서 열에너지를 흡수하기 때문이다.`,`물이 증발하면서 열에너지를 방출하기 때문이다.`,`물이 확산되기 때문이다.`,`물의 질량이 늘기 때문이다.`],1,`응고할 때 열에너지를 방출한다.`);

m(`증발이 잘 일어나는 조건이 <u>아닌</u> 것은?`,[`온도가 높을 때`,`습도가 높을 때`,`바람이 불 때`,`표면적이 넓을 때`,`햇볕이 잘 들 때`],2,`습도가 낮을수록(건조할수록) 증발이 잘 된다.`);
m(`액체를 냉각할 때 온도가 일정하게 유지되는 구간에서 일어나는 상태 변화는?`,[`응고`,`기화`,`융해`,`승화`,`확산`],1,`액체를 식히면 어는점에서 응고가 일어나는 동안 온도가 일정하다.`);

s(`추운 겨울날 밖에 넌 빨래가 꽁꽁 얼었다가도 마른다. 이는 어떤 상태 변화 때문인가?`,`승화 (얼음이 바로 수증기로 변함)`,``);
s(`물질의 상태가 변해도 질량이 변하지 않는 까닭을 입자의 관점에서 쓰시오.`,`상태가 변해도 입자의 종류와 개수가 변하지 않기 때문이다.`,``);
s(`고체가 기체로 변할 때 부피는 어떻게 변하는지 쓰고, 그 까닭을 쓰시오.`,`크게 늘어난다. 입자 사이의 거리가 매우 멀어지기 때문이다.`,``);
s(`유리병에 물을 가득 채워 냉동실에 넣으면 병이 깨질 수 있다. 그 까닭을 쓰시오.`,`물이 얼면서 부피가 늘어나기 때문이다.`,``);
s(`땀이 증발하면 몸이 시원해지는 까닭을 쓰시오.`,`땀이 증발(기화)하면서 몸의 열에너지를 흡수하기 때문이다.`,``);
s(`더운 여름날 마당에 물을 뿌리면 시원해지는 까닭을 쓰시오.`,`물이 증발하면서 주위의 열에너지를 흡수하기 때문이다.`,``);
s(`과수원에서 냉해를 막기 위해 서리가 내리기 전 과일나무에 물을 뿌린다. 그 까닭을 쓰시오.`,`물이 얼면서(응고) 열에너지를 방출하여 과일이 어는 것을 막아 주기 때문이다.`,``);
s(`온도가 높아질수록 입자의 운동은 어떻게 되며, 그 결과 확산과 증발의 빠르기는 어떻게 되는가?`,`입자 운동이 활발해져 확산과 증발이 빨라진다.`,``);
s(`비닐봉지에 드라이아이스를 넣고 묶어 두면 봉지가 부풀어 오른다. 상태 변화의 이름과 부푸는 까닭을 쓰시오.`,`승화. 드라이아이스가 기체로 변하면서 입자 사이의 거리가 멀어져 부피가 크게 늘어나기 때문이다.`,``);
s(`물이 끓는 동안 계속 가열해도 온도가 일정한 까닭을 쓰시오.`,`가해 준 열에너지가 온도를 높이는 데 쓰이지 않고 상태 변화(기화)에 쓰이기 때문이다.`,``);
s(`열에너지를 흡수하는 상태 변화 3가지를 쓰시오.`,`융해, 기화, 승화(고체 → 기체)`,``);
s(`열에너지를 방출하는 상태 변화 3가지를 쓰시오.`,`응고, 액화, 승화(기체 → 고체)`,``);
s(`액체의 특징을 모양과 부피로 나누어 쓰시오.`,`모양은 담는 그릇에 따라 변하고, 부피는 일정하다.`,``);

m(`표는 얼음을 일정하게 가열하면서 측정한 온도이다.`+T([[`시간(분)`,0,2,4,6,8,10,12],[`온도(℃)`,-20,-10,0,0,0,20,40]])+`이에 대한 설명으로 옳은 것은?`,[`4~8분 동안 온도가 일정한 것은 얼음이 녹고 있기 때문이다.`,`4~8분 동안에는 열에너지를 흡수하지 않는다.`,`0~4분 동안 물질은 액체 상태이다.`,`얼음의 녹는점은 -20℃이다.`,`10분 이후 물질은 고체 상태이다.`],1,`4~8분은 융해 중이며, 이때 흡수한 열에너지는 상태 변화에 쓰여 온도가 일정하다. 녹는점은 0℃이다.`);
m(`얼음을 일정하게 가열했더니 4분부터 8분까지 온도가 0℃로 일정했다. 6분일 때 물질의 상태로 옳은 것은?`,[`고체만 있다.`,`액체만 있다.`,`기체만 있다.`,`고체와 액체가 함께 있다.`,`액체와 기체가 함께 있다.`],4,`녹는 중이므로 얼음과 물이 함께 있다.`);
m(`기화의 두 종류인 증발과 끓음을 비교한 것으로 옳은 것은?`,[`증발은 액체 표면에서, 끓음은 액체 표면과 내부에서 일어난다.`,`증발은 끓는점에서만 일어난다.`,`끓음은 액체 표면에서만 일어난다.`,`증발할 때는 기포가 생긴다.`,`증발과 끓음은 같은 온도에서만 일어난다.`],1,`증발은 어떤 온도에서나 표면에서, 끓음은 끓는점에서 내부에서도 기포가 생기며 일어난다.`);
m(`입자 배열이 '규칙적이고 빽빽함'에서 '불규칙하지만 가까움'으로 바뀌었다. 이 상태 변화와 예를 바르게 짝지은 것은?`,[`응고 - 물이 언다.`,`융해 - 초가 녹는다.`,`기화 - 빨래가 마른다.`,`액화 - 이슬이 맺힌다.`,`승화 - 드라이아이스가 작아진다.`],2,`고체 → 액체 = 융해`);
m(`비닐봉지에 아세톤을 몇 방울 넣고 밀봉한 뒤 뜨거운 물에 넣었더니 봉지가 부풀었다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 아세톤이 기화했다.`,`ㄴ. 아세톤 입자의 개수가 늘어났다.`,`ㄷ. 아세톤 입자 사이의 거리가 멀어졌다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄱ, ㄷ`,`ㄱ, ㄴ, ㄷ`],4,`입자의 개수는 그대로이고 거리만 멀어져 부피가 커졌다.`);
m(`아세톤을 넣고 밀봉한 비닐봉지를 뜨거운 물에 넣었더니 아세톤이 기화하여 봉지가 부풀었다. 기화하기 전과 후 비닐봉지 전체의 질량을 비교하면?`,[`기화 후가 더 크다.`,`기화 후가 더 작다.`,`같다.`,`기화 후 0이 된다.`,`알 수 없다.`],3,`밀봉되어 있으므로 입자가 빠져나가지 않아 질량이 같다.`);
m(`비커에 녹인 촛농을 식혀 굳혔더니 가운데가 오목해졌다. 굳기 전과 비교한 부피와 질량의 변화는?`,[`부피 감소, 질량 감소`,`부피 감소, 질량 일정`,`부피 증가, 질량 일정`,`부피 일정, 질량 감소`,`부피 증가, 질량 증가`],2,`응고하면 입자 사이 거리가 가까워져 부피가 줄지만 질량은 일정하다.`);
m(`물이 얼음이 될 때 부피와 질량의 변화는?`,[`부피 감소, 질량 일정`,`부피 증가, 질량 일정`,`부피 증가, 질량 증가`,`부피 일정, 질량 증가`,`부피 감소, 질량 감소`],2,`물은 예외적으로 얼 때 부피가 늘어난다. 질량은 언제나 일정하다.`);
m(`열에너지를 방출하는 현상으로만 짝지은 것은?`+B([`ㄱ. 소나기가 오기 전에 날씨가 후텁지근하다.`,`ㄴ. 아이스박스에 얼음을 넣어 음식을 차갑게 한다.`,`ㄷ. 증기(스팀) 난방으로 방을 데운다.`,`ㄹ. 젖은 물수건을 이마에 올려 열을 내린다.`]),[`ㄱ, ㄴ`,`ㄱ, ㄷ`,`ㄴ, ㄷ`,`ㄴ, ㄹ`,`ㄷ, ㄹ`],2,`ㄱ, ㄷ은 수증기가 액화하며 열 방출. ㄴ(융해), ㄹ(증발)은 열 흡수`);
m(`같은 양의 물을 (가) 넓은 접시와 (나) 좁은 컵에 담아 같은 곳에 두었다. 물이 더 빨리 줄어드는 것과 그 까닭은?`,[`(가), 표면적이 넓어 증발이 잘 되기 때문`,`(나), 표면적이 좁아 증발이 잘 되기 때문`,`(가), 물의 온도가 낮기 때문`,`(나), 물이 깊기 때문`,`둘이 같다.`],1,`증발은 액체 표면에서 일어나므로 표면적이 넓을수록 빠르다.`);
m(`공기 중보다 진공 속에서 확산이 더 빠르게 일어나는 까닭은?`,[`퍼져 나가는 입자를 방해하는 다른 입자가 없기 때문이다.`,`진공에서는 입자가 커지기 때문이다.`,`진공에서는 온도가 높기 때문이다.`,`진공에서는 입자의 개수가 늘기 때문이다.`,`진공에서는 중력이 크기 때문이다.`],1,`공기 중에서는 공기 입자와 부딪혀 퍼지는 속도가 느려진다.`);
m(`냉장고 안을 차갑게 만드는 냉매의 상태 변화는?`,[`냉장고 안에서 기화하며 열 흡수`,`냉장고 안에서 액화하며 열 흡수`,`냉장고 안에서 응고하며 열 방출`,`냉장고 안에서 융해하며 열 방출`,`냉장고 안에서 확산하며 열 흡수`],1,`냉매가 냉장고 안쪽 관에서 기화하며 주위의 열을 흡수한다.`);
m(`액체가 든 손난로의 금속판을 꺾으면 손난로가 하얗게 굳으면서 따뜻해진다. 이때 일어나는 상태 변화는?`,[`융해`,`응고`,`기화`,`액화`,`승화`],2,`액체가 고체로 응고하면서 열에너지를 방출한다.`);
m(`이슬과 서리에 대한 설명으로 옳은 것을 모두 고른 것은?`+B([`ㄱ. 모두 공기 중의 수증기가 상태 변화한 것이다.`,`ㄴ. 모두 열에너지를 방출한다.`,`ㄷ. 이슬은 액화, 서리는 융해에 의해 생긴다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`서리는 수증기가 바로 고체가 되는 승화(기체→고체)이다.`);
m(`드라이아이스 주변에 생기는 하얀 연기의 정체는?`,[`이산화 탄소 기체`,`공기 중 수증기가 액화한 작은 물방울`,`드라이아이스가 녹은 액체`,`산소 기체`,`먼지`],2,`이산화 탄소 기체는 눈에 보이지 않는다. 차가운 기체 때문에 주위 수증기가 액화한 물방울이 보이는 것이다.`);
m(`주전자에서 물이 끓을 때 입구 위에 생기는 하얀 김의 정체는?`,[`수증기`,`수증기가 액화한 작은 물방울`,`공기`,`연기`,`산소`],2,`수증기는 보이지 않는다. 하얀 김은 수증기가 식어서 생긴 물방울이다.`);
m(`주위의 온도를 낮추는 상태 변화로만 짝지은 것은?`+B([`ㄱ. 융해`,`ㄴ. 응고`,`ㄷ. 기화`,`ㄹ. 승화(고체 → 기체)`]),[`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄷ, ㄹ`,`ㄴ, ㄷ, ㄹ`,`ㄱ, ㄴ, ㄷ, ㄹ`],3,`열을 흡수하는 상태 변화가 주위 온도를 낮춘다.`);
m(`표는 액체 상태의 물질 X를 냉각하면서 측정한 온도이다.`+T([[`시간(분)`,0,2,4,6,8,10,12],[`온도(℃)`,100,90,80,80,80,70,60]])+`물질 X의 어는점은?`,[`100℃`,`90℃`,`80℃`,`70℃`,`60℃`],3,`냉각할 때 온도가 일정한 구간의 온도가 어는점이다.`);
m(`표의 물질 중 25℃에서 고체 상태인 것은?`+T([[`물질`,`녹는점(℃)`,`끓는점(℃)`],[`A`,0,100],[`B`,80,218],[`C`,-114,78]]),[`A`,`B`,`C`,`A, C`,`모두`],2,`25℃가 녹는점보다 낮으면 고체이다. B의 녹는점은 80℃이므로 25℃에서는 고체이다.`);
m(`얼음물이 든 컵을 전자저울 위에 올려 두었더니 시간이 지나며 질량이 조금씩 늘어났다. 그 까닭은?`,[`공기 중의 수증기가 컵 표면에서 액화하여 붙었기 때문이다.`,`얼음이 녹으면서 질량이 늘었기 때문이다.`,`컵 속의 물이 새어 나왔기 때문이다.`,`얼음이 승화했기 때문이다.`,`물이 증발했기 때문이다.`],1,`컵 밖의 수증기가 액화해 물방울로 붙으면서 질량이 늘어난다. 얼음이 녹는 것만으로는 질량이 변하지 않는다.`);
s(`표는 얼음을 가열하면서 측정한 온도이다.`+T([[`시간(분)`,0,2,4,6,8,10],[`온도(℃)`,-10,0,0,0,10,20]])+`(1) 얼음의 녹는점은? (2) 2~6분 동안 온도가 일정한 까닭을 쓰시오.`,`(1) 0℃ (2) 가해 준 열에너지가 얼음이 녹는 상태 변화(융해)에 쓰이기 때문이다.`,``);
s(`증발과 끓음의 차이점을 두 가지 쓰시오.`,`① 증발은 액체 표면에서, 끓음은 액체 표면과 내부에서 일어난다. ② 증발은 어떤 온도에서나 일어나지만, 끓음은 끓는점에서 일어난다. (끓음은 기포가 생긴다.)`,``);
s(`녹인 촛농이 굳으면서 가운데가 오목해졌다. 부피와 질량의 변화를 쓰고, 그 까닭을 입자 배열로 설명하시오.`,`부피는 줄고 질량은 일정하다. 입자 사이의 거리가 가까워지지만 입자의 개수는 변하지 않기 때문이다.`,``);
s(`물이 얼 때 부피 변화는 다른 대부분의 물질과 어떻게 다른지 쓰시오.`,`대부분의 물질은 응고할 때 부피가 줄지만, 물은 얼 때 부피가 늘어난다.`,``);
s(`비닐봉지에 아세톤을 넣고 밀봉한 뒤 뜨거운 물에 넣었더니 봉지가 부풀었다. 상태 변화의 이름과 봉지가 부푼 까닭을 쓰시오.`,`기화. 아세톤이 기체로 변하면서 입자 사이의 거리가 멀어져 부피가 늘어났기 때문이다.`,``);
s(`라면을 끓일 때 냄비 위로 보이는 하얀 김은 수증기가 아니다. 하얀 김의 정체를 쓰고 생기는 과정을 설명하시오.`,`작은 물방울. 냄비에서 나온 수증기가 차가운 공기를 만나 액화하여 생긴다.`,``);
s(`냉장고 안이 차가워지는 원리를 냉매의 상태 변화와 열에너지의 출입으로 설명하시오.`,`냉매가 냉장고 안의 관을 지나며 기화할 때 주위의 열에너지를 흡수하므로 냉장고 안이 차가워진다.`,``);
s(`눈이 내리는 날에는 날씨가 비교적 포근하게 느껴진다. 그 까닭을 쓰시오.`,`공기 중의 수증기가 눈(고체)으로 변하면서 열에너지를 방출하기 때문이다.`,``);
s(`소나기가 내리기 전에 날씨가 후텁지근해지는 까닭을 쓰시오.`,`공기 중의 수증기가 액화하여 빗방울이 되면서 열에너지를 방출하기 때문이다.`,``);
s(`젖은 빨래를 빨리 말리는 방법 세 가지를 쓰시오.`,`햇볕이 잘 드는 곳에 넌다, 바람이 잘 통하는 곳에 넌다, 빨래를 넓게 펴서 넌다 (습도가 낮은 날 넌다)`,`온도, 바람, 표면적, 습도`);
s(`방향제의 향기가 겨울보다 여름에 더 빨리 퍼지는 까닭을 쓰시오.`,`여름에는 온도가 높아 입자 운동이 활발하므로 확산이 더 빠르기 때문이다.`,``);
s(`20℃의 물과 60℃의 물에 잉크를 한 방울씩 떨어뜨렸다. 예상되는 결과와 그 까닭을 쓰시오.`,`60℃의 물에서 잉크가 더 빨리 퍼진다. 온도가 높을수록 입자 운동이 활발하기 때문이다.`,``);
s(`아이스크림을 포장할 때 얼음 대신 드라이아이스를 넣는 까닭을 두 가지 쓰시오.`,`① 드라이아이스가 승화하면서 열에너지를 흡수해 아이스크림을 차갑게 유지한다. ② 고체에서 바로 기체가 되므로 녹은 물이 생기지 않아 포장이 젖지 않는다.`,``);
s(`에어컨이 작동할 때 실외기에서 더운 바람이 나오는 까닭을 쓰시오.`,`실외기에서 냉매가 액화하면서 열에너지를 방출하기 때문이다.`,``);
s(`고체가 액체를 거쳐 기체로 변할 때 입자의 배열, 입자 사이의 거리, 입자 운동이 어떻게 변하는지 쓰시오.`,`배열은 규칙적 → 불규칙적으로, 입자 사이 거리는 점점 멀어지고, 입자 운동은 점점 활발해진다.`,``);
s(`어항의 물이 줄어든 것은 물이 없어진 것이 아니다. 물이 어디로 갔는지 입자의 관점에서 설명하시오.`,`물 입자가 증발하여 수증기가 되어 공기 중으로 퍼져 나갔다. 입자의 개수는 그대로이다.`,``);
s(`차가운 음료 캔 표면의 물방울이 캔 속 음료가 새어 나온 것이 아니라는 증거를 한 가지 쓰시오.`,`물방울을 맛보면 음료 맛이 나지 않는다 / 빈 캔을 차갑게 해도 물방울이 생긴다 / 캔 속 음료의 양이 줄지 않는다 등`,`공기 중 수증기가 액화한 것이다.`);
s(`액체를 냉각할 때 냉각 곡선에서 온도가 일정한 구간 동안 일어나는 일과 열에너지의 출입을 쓰시오.`,`액체가 고체로 응고하며, 이때 열에너지를 방출한다. 방출하는 열 때문에 온도가 내려가지 않고 일정하다.`,``);
s(`겨울철 수도 계량기를 헌 옷이나 스티로폼으로 감싸 보온하는 까닭을 쓰시오.`,`물이 얼면 부피가 늘어나 계량기나 관이 터질 수 있으므로, 물이 얼지 않게 하기 위해서이다.`,``);
s(`열이 날 때 젖은 물수건을 이마에 올려 두면 열이 내리는 원리를 쓰시오.`,`물수건의 물이 증발하면서 이마의 열에너지를 흡수하기 때문이다.`,``);

u='S';l=5;
m(`표는 고체 물질 A를 일정하게 가열하면서 측정한 온도이다.`+T([[`시간(분)`,0,3,6,9,12,15,18],[`온도(℃)`,20,50,80,80,80,110,140]])+`옳은 것을 모두 고른 것은?`+B([`ㄱ. 6~12분 동안 물질 A는 열에너지를 흡수한다.`,`ㄴ. 9분일 때 고체와 액체가 함께 있다.`,`ㄷ. 6~12분 동안 온도가 일정한 것은 열에너지를 흡수하지 않기 때문이다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`온도가 일정한 구간에서도 계속 열을 흡수하며, 그 열은 융해에 쓰인다.`);
m(`같은 물질의 질량을 2배로 늘려 같은 불꽃으로 가열할 때, 가열 곡선의 변화로 옳은 것은?`,[`녹는점이 2배로 높아진다.`,`녹는점은 같고, 녹는 데 걸리는 시간이 길어진다.`,`녹는점이 낮아진다.`,`녹는점도 같고 녹는 시간도 같다.`,`온도가 일정한 구간이 없어진다.`],2,`녹는점은 물질의 양과 관계없이 일정하다. 양이 많으면 녹이는 데 더 많은 열과 시간이 필요하다.`);
m(`물질의 응고와 부피 변화에 대한 설명으로 옳은 것을 모두 고른 것은?`+B([`ㄱ. 촛농이 응고할 때는 입자 사이의 거리가 가까워진다.`,`ㄴ. 물은 얼음이 되면 입자 사이에 빈 공간이 많아진다.`,`ㄷ. 두 경우 모두 응고하면 질량이 변한다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`질량은 어떤 상태 변화에서도 변하지 않는다.`);
m(`상태 변화를 (가) 고체→액체 (나) 액체→기체 (다) 기체→액체 (라) 액체→고체 (마) 고체→기체 (바) 기체→고체로 나타냈다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. (나)의 예로 젖은 빨래가 마르는 것이 있다.`,`ㄴ. (바)의 예로 서리가 내리는 것이 있다.`,`ㄷ. (라)의 예로 아이스크림이 녹는 것이 있다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`아이스크림이 녹는 것은 (가) 융해이다.`);
m(`다음 중 열에너지를 방출하는 현상을 모두 고른 것은?`+B([`ㄱ. 이글루 안에 물을 뿌린다.`,`ㄴ. 증기 난방으로 방을 데운다.`,`ㄷ. 액체 손난로가 굳으며 따뜻해진다.`,`ㄹ. 땀이 증발한다.`,`ㅁ. 손등에 바른 알코올이 마른다.`]),[`ㄱ, ㄴ`,`ㄹ, ㅁ`,`ㄱ, ㄴ, ㄷ`,`ㄴ, ㄷ, ㄹ`,`ㄷ, ㄹ, ㅁ`],3,`ㄱ·ㄷ 응고, ㄴ 액화는 방출 / ㄹ·ㅁ 증발은 흡수`);
m(`같은 양의 물에 적신 수건을 (가) 그늘·바람 없음 (나) 햇볕·바람 없음 (다) 햇볕·바람 있음 조건에 널었다. 빨리 마르는 순서는?`,[`(가) > (나) > (다)`,`(나) > (가) > (다)`,`(다) > (나) > (가)`,`(다) > (가) > (나)`,`모두 같다.`],3,`온도가 높고 바람이 불수록 증발이 빠르다.`);
m(`아세톤을 넣고 밀봉한 비닐봉지를 뜨거운 물에 넣었다가 다시 찬물로 옮겼다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 뜨거운 물에서 아세톤이 기화하여 봉지가 부푼다.`,`ㄴ. 찬물로 옮기면 아세톤이 액화하여 봉지가 다시 쭈그러든다.`,`ㄷ. 전 과정에서 봉지 전체의 질량은 일정하다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],5,`기화 → 액화가 일어나도 밀봉되어 있으므로 질량은 일정하다.`);
m(`10℃, 30℃, 60℃의 물에 잉크를 떨어뜨리고 고르게 퍼지는 데 걸린 시간을 쟀더니 각각 15분, 8분, 3분이었다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 온도가 높을수록 잉크가 빨리 퍼진다.`,`ㄴ. 온도가 높을수록 입자 운동이 활발하다.`,`ㄷ. 60℃에서는 잉크 입자의 개수가 늘어나서 빨리 퍼진다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`온도가 높아져도 입자의 개수는 변하지 않는다.`);
m(`물이 끓는 주전자 입구를 자세히 보면, 입구 바로 위는 투명하고 조금 떨어진 곳에서 하얀 김이 보인다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 입구 바로 위 투명한 부분에는 수증기가 있다.`,`ㄴ. 하얀 김은 수증기가 액화한 작은 물방울이다.`,`ㄷ. 하얀 김은 더 올라가면 다시 증발하여 보이지 않게 된다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],5,`수증기는 보이지 않고, 식어서 액화한 물방울이 하얗게 보이며, 이 물방울은 다시 증발하여 사라진다.`);
m(`녹인 파라핀(양초 원료)을 식히면서 온도를 측정하였다. 온도가 일정한 구간에 대해 옳은 것을 모두 고른 것은?`+B([`ㄱ. 파라핀이 응고하고 있다.`,`ㄴ. 파라핀은 열에너지를 방출하고 있다.`,`ㄷ. 이 구간이 끝나면 파라핀의 부피는 처음보다 줄어 있다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],5,`파라핀은 굳으면서(응고) 열을 방출하고, 부피가 줄어든다.`);
m(`음식을 차갑게 보관할 때 얼음과 드라이아이스를 비교한 것으로 옳은 것을 모두 고른 것은?`+B([`ㄱ. 둘 다 상태가 변하면서 열에너지를 흡수한다.`,`ㄴ. 얼음은 녹으면서 물이 생긴다.`,`ㄷ. 드라이아이스는 승화하므로 액체가 남지 않는다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],5,`얼음은 융해, 드라이아이스는 승화로 열을 흡수한다.`);
m(`상태 변화가 일어날 때 질량이 변하는지 확인하는 실험을 할 때, 용기의 입구를 꼭 막아야 하는 까닭은?`,[`기체로 변한 입자가 빠져나가지 않게 하기 위해서`,`온도를 높이기 위해서`,`입자의 개수를 늘리기 위해서`,`빛을 차단하기 위해서`,`입자의 크기를 작게 하기 위해서`],1,`입구가 열려 있으면 기화한 입자가 빠져나가 질량이 줄어든 것처럼 보인다.`);
m(`얼음 100g이 모두 녹아 물이 되었다가, 다시 모두 끓어 수증기가 되었다. 옳은 것은?`,[`물의 질량은 100g보다 크다.`,`수증기의 질량은 100g이다.`,`물의 부피는 얼음보다 크다.`,`수증기의 부피는 물보다 작다.`,`상태가 변할수록 질량이 줄어든다.`],2,`질량은 항상 100g. 부피는 얼음 > 물(물의 예외), 수증기는 매우 크다.`);
m(`같은 물질 A, B를 같은 불꽃으로 가열하였다. 둘 다 50℃에서 온도가 일정했는데, 일정한 구간이 A는 4분, B는 8분이었다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. A와 B는 같은 물질일 수 있다.`,`ㄴ. B의 질량이 A보다 크다.`,`ㄷ. A의 녹는점이 B보다 높다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`녹는점(50℃)이 같으므로 같은 물질일 수 있고, 녹는 시간이 길수록 양이 많다.`);
m(`생활 속 현상과 상태 변화를 바르게 짝지은 것은?`,[`안경에 김이 서림 - 기화`,`서리가 내림 - 승화(기체 → 고체)`,`고드름이 생김 - 융해`,`나프탈렌이 작아짐 - 융해`,`땀이 마름 - 액화`],2,`김 서림은 액화, 고드름은 응고, 나프탈렌은 승화, 땀 마름은 기화이다.`);
m(`냉장고와 에어컨의 원리에 대해 옳은 것을 모두 고른 것은?`+B([`ㄱ. 냉장고 안에서는 냉매가 기화하며 열에너지를 흡수한다.`,`ㄴ. 냉장고 뒤쪽에서는 냉매가 액화하며 열에너지를 방출한다.`,`ㄷ. 냉매는 상태가 변할 때마다 질량이 조금씩 줄어든다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`냉매의 질량은 변하지 않는다. 그래서 계속 순환하며 사용할 수 있다.`);
m(`표를 보고 25℃에서 기체 상태인 물질을 고르시오.`+T([[`물질`,`녹는점(℃)`,`끓는점(℃)`],[`A`,-39,357],[`B`,0,100],[`C`,-218,-183],[`D`,801,1413]]),[`A`,`B`,`C`,`D`,`A, B`],3,`25℃가 끓는점보다 높으면 기체이다. C의 끓는점은 -183℃이다.`);
m(`표를 보고 120℃에서 액체 상태인 물질만 고른 것은?`+T([[`물질`,`녹는점(℃)`,`끓는점(℃)`],[`A`,-39,357],[`B`,0,100],[`C`,-218,-183],[`D`,801,1413]]),[`A`,`B`,`A, B`,`A, D`,`B, D`],1,`A: 녹는점 −39℃ < 120℃ < 끓는점 357℃ → 액체. B는 기체, D는 고체이다.`);
m(`주사기 두 개에 각각 공기와 물을 넣고 입구를 막은 뒤 피스톤을 눌렀다. 결과와 그 까닭으로 옳은 것은?`,[`둘 다 잘 눌린다. 입자가 작아지기 때문이다.`,`공기만 잘 눌린다. 기체는 입자 사이의 거리가 멀기 때문이다.`,`물만 잘 눌린다. 액체는 입자 사이의 거리가 멀기 때문이다.`,`둘 다 눌리지 않는다.`,`공기만 잘 눌린다. 기체 입자의 개수가 줄어들기 때문이다.`],2,`기체는 입자 사이에 빈 공간이 많아 압축된다. 입자의 개수는 줄지 않는다.`);
m(`추운 겨울날 아침, 유리창에 성에가 생기는 면과 그 까닭으로 옳은 것은?`,[`바깥쪽 면, 바깥 공기 중 수증기가 승화하기 때문`,`안쪽 면, 따뜻한 실내 공기 속 수증기가 차가운 유리에 닿아 고체로 변하기 때문`,`안쪽 면, 유리가 녹기 때문`,`바깥쪽 면, 실내의 열이 빠져나가기 때문`,`양쪽 면 모두, 유리가 응고하기 때문`],2,`실내 공기에 수증기가 많고, 그 수증기가 차가운 유리 안쪽 면에서 바로 얼음 알갱이로 변한다.`);
s(`표는 얼음을 가열하면서 측정한 온도이다.`+T([[`시간(분)`,0,2,4,6,8,10,12,14,16],[`온도(℃)`,-20,0,0,0,50,100,100,100,100]])+`(1) 2~6분, (2) 10~16분 동안 일어나는 상태 변화와 이때 존재하는 물질의 상태를 쓰고 (3) 두 구간에서 온도가 일정한 까닭을 쓰시오.`,`(1) 융해, 고체와 액체 (2) 기화(끓음), 액체와 기체 (3) 가해 준 열에너지가 온도를 높이지 않고 상태 변화에 쓰이기 때문이다.`,``);
s(`아세톤을 넣고 밀봉한 비닐봉지를 뜨거운 물에 넣었다가 찬물로 옮겼다. 각 과정에서 일어나는 상태 변화, 부피와 질량의 변화를 입자의 관점에서 설명하시오.`,`뜨거운 물: 기화 → 입자 사이 거리가 멀어져 부피 증가. 찬물: 액화 → 입자 사이 거리가 가까워져 부피 감소. 두 과정 모두 입자의 개수가 그대로이므로 질량은 일정하다.`,``);
s(`다음 현상을 열에너지를 흡수하는 것과 방출하는 것으로 분류하고, 각각 어떤 상태 변화인지 쓰시오. (가) 아이스박스 속 얼음 (나) 이슬이 맺힘 (다) 주사 전 알코올 솜 (라) 과일나무에 물 뿌리기`,`흡수: (가) 융해, (다) 기화 / 방출: (나) 액화, (라) 응고`,``);
s(`빨래를 빨리 말리는 방법 세 가지를 쓰고, 각 방법을 입자 운동이나 증발 조건과 연결하여 설명하시오.`,`① 햇볕에 넌다: 온도가 높아 입자 운동이 활발해진다. ② 바람이 통하는 곳에 넌다: 증발한 수증기를 바람이 날려 보내 증발이 계속 잘 된다. ③ 넓게 펴서 넌다: 표면적이 넓어져 증발이 잘 된다.`,``);
s(`냉장고의 원리를 냉매가 냉장고 안과 뒤쪽을 순환하며 일으키는 상태 변화와 열에너지 출입으로 설명하시오.`,`냉장고 안: 냉매가 기화하면서 열에너지를 흡수하여 내부가 차가워진다. 냉장고 뒤쪽: 기체 냉매가 압축되어 액화하면서 열에너지를 방출하므로 뒤쪽이 따뜻하다.`,``);
s(`같은 부피의 물과 녹인 촛농을 각각 비커에 담아 얼리거나 굳혔다. 각각의 윗면 모양을 예측하고 그 까닭을 쓰시오.`,`물: 가운데가 볼록 솟는다(부피 증가). 촛농: 가운데가 오목하게 들어간다(부피 감소). 물은 얼 때 부피가 늘어나는 예외적인 물질이기 때문이다.`,``);
s(`수증기, 주전자의 하얀 김, 드라이아이스 주변의 하얀 연기의 공통점과 차이점을 쓰시오.`,`수증기는 기체라 보이지 않는다. 하얀 김과 하얀 연기는 모두 수증기가 액화한 작은 물방울이다. 김은 뜨거운 수증기가 식어서, 연기는 차가운 이산화 탄소 기체가 공기 중 수증기를 식혀서 생긴다.`,``);
s(`겨울철 이글루 안에 물을 뿌리면 따뜻해지고, 여름철 마당에 물을 뿌리면 시원해진다. 같은 물인데 결과가 반대인 까닭을 쓰시오.`,`이글루 안에서는 물이 얼면서(응고) 열에너지를 방출하고, 여름 마당에서는 물이 증발(기화)하면서 열에너지를 흡수하기 때문이다.`,``);
s(`'온도에 따른 확산 빠르기 비교' 실험을 설계하시오. (1) 같게 할 조건 2가지 (2) 다르게 할 조건 (3) 예상 결과를 쓰시오.`,`(1) 물의 양, 잉크의 양, 비커 크기, 젓지 않기 등에서 2가지 (2) 물의 온도 (3) 온도가 높은 물에서 잉크가 더 빨리 퍼진다.`,``);
s(`더운 지방에서는 물을 유리병이 아닌 겉에 작은 구멍이 많은 토기 항아리에 보관하면 시원하게 유지된다고 한다. 그 원리를 쓰시오.`,`항아리의 작은 구멍으로 스며 나온 물이 표면에서 증발하면서 열에너지를 흡수하여 항아리 속 물의 온도를 낮춰 준다.`,``);
s(`표를 보고 25℃에서 각 물질의 상태를 쓰고, 판단 방법을 설명하시오.`+T([[`물질`,`녹는점(℃)`,`끓는점(℃)`],[`가`,-114,78],[`나`,80,218],[`다`,-218,-183]]),`가: 액체, 나: 고체, 다: 기체. 온도가 녹는점보다 낮으면 고체, 녹는점과 끓는점 사이면 액체, 끓는점보다 높으면 기체이다.`,``);
s(`얼음물이 든 컵을 저울에 올려 두었더니 질량이 늘어났다. 그 까닭과, 컵 속 얼음이 녹는 것은 질량에 어떤 영향을 주는지 함께 쓰시오.`,`공기 중 수증기가 차가운 컵 표면에서 액화하여 물방울로 붙었기 때문이다. 얼음이 녹는 것(융해)은 질량을 변화시키지 않는다.`,``);
s(`액체 상태의 물질을 냉각하면서 온도를 쟀더니 80℃에서 한동안 온도가 일정했다. 이 물질의 어는점과 녹는점을 쓰고, 온도가 일정한 동안 일어나는 일을 열에너지 출입과 함께 쓰시오.`,`어는점 80℃, 녹는점 80℃. 응고가 일어나며 열에너지를 방출하기 때문에 온도가 일정하게 유지된다.`,``);
s(`같은 고체 물질 50g과 100g을 같은 불꽃으로 가열할 때, 두 가열 곡선의 같은 점과 다른 점을 예측하여 쓰시오.`,`같은 점: 녹는점(온도가 일정한 구간의 온도)이 같다. 다른 점: 100g은 녹는점에 도달하는 데와 다 녹는 데 시간이 더 오래 걸린다.`,``);
s(`액체형 손난로는 금속판을 꺾으면 굳으면서 따뜻해지고, 끓는 물에 넣으면 다시 액체가 되어 재사용할 수 있다. 두 과정의 상태 변화와 열에너지 출입을 쓰시오.`,`사용할 때: 응고, 열에너지 방출. 재사용 준비: 융해, 열에너지 흡수.`,``);
s(`주사기 두 개에 공기와 물을 각각 넣고 입구를 막은 뒤 피스톤을 눌렀다. 결과를 쓰고 그 까닭을 입자 배열로 설명하시오.`,`공기가 든 주사기만 잘 눌린다. 기체는 입자 사이의 거리가 멀어 빈 공간이 많지만, 액체는 입자 사이가 가까워 거의 압축되지 않는다.`,``);
s(`드라이아이스를 페트병에 넣고 뚜껑을 꽉 닫으면 위험하다. 그 까닭을 상태 변화와 부피 변화로 설명하시오.`,`드라이아이스가 승화하여 기체가 되면 부피가 매우 크게 늘어나는데, 밀폐된 병 안에서는 늘어날 공간이 없어 병이 터질 수 있다.`,`안전 수칙: 드라이아이스는 밀폐 용기에 넣지 않는다.`);
s(`겨울철 수도관이 터지는 것을 막는 방법 두 가지와 각각의 원리를 쓰시오.`,`① 수도관을 보온재로 감싼다: 물이 얼지 않게 한다. ② 수도꼭지를 조금 틀어 물이 흐르게 한다: 흐르는 물은 잘 얼지 않는다. 물이 얼면 부피가 늘어나 관이 터지기 때문이다.`,``);
s(`손등의 한쪽에는 물을, 다른 쪽에는 알코올을 같은 양 발랐다. 어느 쪽이 더 빨리 마르고 더 시원한지 쓰고 그 까닭을 쓰시오.`,`알코올 쪽. 알코올이 물보다 빨리 증발하면서 같은 시간 동안 열에너지를 더 많이 흡수하기 때문이다.`,``);
s(`눈이 내리기 시작할 때는 포근하고, 쌓인 눈이 녹을 때는 더 춥게 느껴진다. 그 까닭을 상태 변화와 열에너지로 설명하시오.`,`눈이 만들어질 때(수증기 → 얼음)는 열에너지를 방출해 포근하고, 눈이 녹을 때(융해)는 주위의 열에너지를 흡수해 춥게 느껴진다.`,``);

u='S';l=9;
m(`어떤 고체 물질 100g을 일정한 불꽃으로 가열했더니 온도가 일정한 구간이 5분 동안 나타났다. 같은 물질 300g을 같은 불꽃으로 가열하면 온도가 일정한 구간의 온도와 시간은?`,[`녹는점은 3배, 시간은 5분`,`녹는점은 같고, 시간은 약 15분`,`녹는점은 같고, 시간은 5분`,`녹는점은 1/3, 시간은 15분`,`온도가 일정한 구간이 없다.`],2,`녹는점은 양과 관계없이 같다. 양이 3배이면 녹이는 데 필요한 열이 약 3배 → 시간 약 3배`);
m(`0℃의 얼음과 0℃의 물이 섞여 있는 비커를 계속 가열할 때 온도 변화로 옳은 것은?`,[`바로 온도가 올라간다.`,`얼음이 모두 녹을 때까지 0℃를 유지하다가 그 뒤 올라간다.`,`온도가 내려간다.`,`100℃까지 일정하다.`,`얼음이 녹으면서 온도가 낮아진다.`],2,`얼음이 녹는 동안(융해 중) 가한 열은 상태 변화에 쓰이므로 0℃로 일정하다.`);
m(`밀폐된 용기 속 액체를 가열하여 모두 기체로 만들었다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 입자의 개수는 같다.`,`ㄴ. 입자의 크기가 커진다.`,`ㄷ. 입자 사이의 거리가 멀어진다.`,`ㄹ. 입자의 운동이 활발해진다.`]),[`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄷ, ㄹ`,`ㄴ, ㄷ, ㄹ`,`ㄱ, ㄴ, ㄷ, ㄹ`],3,`입자의 크기는 변하지 않는다. 부피가 커지는 것은 거리가 멀어지기 때문이다.`);
m(`녹는점이 60℃인 고체 A와 80℃인 고체 B를 시험관에 각각 넣어 70℃로 유지되는 물에 오랫동안 담가 두었다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. A는 액체가 된다.`,`ㄴ. B는 고체로 남는다.`,`ㄷ. 물의 온도를 90℃로 올리면 B도 녹는다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],5,`온도가 녹는점보다 높으면 녹는다.`);
m(`라면 수프 속 건조된 채소는 '동결 건조'로 만든다. 채소를 얼린 뒤 압력이 매우 낮은 곳에 두어 얼음을 물을 거치지 않고 수증기로 날려 보낸다. 이 과정의 상태 변화를 순서대로 나열한 것은?`,[`응고 → 승화(고체 → 기체)`,`융해 → 기화`,`응고 → 융해`,`액화 → 응고`,`기화 → 액화`],1,`채소 속 물이 얼고(응고), 그 얼음이 바로 수증기가 된다(승화).`);
m(`시험관에 물을 넣고 얼음과 소금을 섞은 냉각제에 담가 온도를 쟀더니 20℃ → 0℃(한동안 일정) → -5℃로 변했다. 0℃가 유지되는 동안에 대해 옳은 것을 모두 고른 것은?`+B([`ㄱ. 시험관 속에서 응고가 일어난다.`,`ㄴ. 시험관 속 물질은 열에너지를 방출한다.`,`ㄷ. 시험관 속 물질의 질량이 줄어든다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`응고하며 열을 방출하고, 그 열은 냉각제로 빠져나간다. 질량은 변하지 않는다.`);
m(`여름에 에어컨을 켠 차에서 내리면 안경에 김이 서리고, 겨울에 따뜻한 버스에 타도 안경에 김이 서린다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 두 경우 모두 수증기가 액화한 것이다.`,`ㄴ. 여름에는 바깥 공기의 수증기가, 겨울에는 버스 안 공기의 수증기가 물방울이 된다.`,`ㄷ. 두 경우 모두 안경이 주위 공기보다 차갑다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],5,`차가운 안경 표면에 닿은 따뜻한 공기 속 수증기가 액화한다.`);
m(`물 10g은 액체일 때 부피가 10cm³이고, 얼음이 되면 약 10.9cm³가 된다. 물 100g을 모두 얼리면 얼음의 질량과 부피는?`,[`100g, 100cm³`,`100g, 약 109cm³`,`109g, 약 109cm³`,`91g, 100cm³`,`100g, 약 91cm³`],2,`질량은 그대로 100g, 부피는 10배 → 약 109cm³`);
m(`-50℃에서 액체 상태인 물질은?`+T([[`물질`,`녹는점(℃)`,`끓는점(℃)`],[`수은`,-39,357],[`물`,0,100],[`에탄올`,-114,78],[`산소`,-218,-183]]),[`수은`,`물`,`에탄올`,`산소`,`수은, 에탄올`],3,`-50℃는 수은의 녹는점(-39℃)보다 낮아 수은은 고체이다. 에탄올은 -114℃ < -50℃ < 78℃ 이므로 액체이다.`);
m(`어떤 물질의 가열 곡선에서 녹는점이 80℃였다. 같은 물질의 액체를 냉각할 때 온도가 일정하게 유지되는 온도와 그 동안 일어나는 일은?`,[`80℃, 응고`,`80℃, 융해`,`0℃, 응고`,`100℃, 액화`,`알 수 없다.`],1,`같은 물질의 어는점은 녹는점과 같다.`);
m(`온도계 두 개 중 하나의 끝(구부)을 젖은 헝겊으로 감싸 두었다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 젖은 헝겊을 감싼 온도계의 온도가 더 낮게 나타난다.`,`ㄴ. 헝겊의 물이 증발하면서 열에너지를 흡수하기 때문이다.`,`ㄷ. 공기가 건조할수록 두 온도계의 온도 차이가 커진다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],5,`건조하면 증발이 더 잘 되어 열을 더 많이 흡수한다. 이 원리로 습도를 잰다(건습구 습도계).`);
m(`주사기에 에탄올 몇 방울을 넣고 입구를 막은 뒤 뜨거운 물에 담갔더니 피스톤이 밀려 나왔고, 다시 찬물에 담갔더니 피스톤이 원래 위치로 돌아왔다. 이 과정에 대한 설명으로 옳은 것은?`,[`뜨거운 물에서 에탄올 입자의 개수가 늘었다.`,`뜨거운 물에서 기화, 찬물에서 액화가 일어났으며 질량은 일정하다.`,`찬물에서 에탄올이 응고했다.`,`뜨거운 물에서 에탄올 입자의 크기가 커졌다.`,`찬물에서 질량이 줄었다.`],2,`입자의 개수와 크기는 그대로이고 거리만 변했다.`);
m(`같은 종류의 상태 변화로만 묶인 것은?`,[`이슬, 서리`,`안경의 김 서림, 겨울철 입김, 구름의 생성`,`나프탈렌이 작아짐, 아이스크림이 녹음`,`성에, 고드름`,`땀이 마름, 이슬이 맺힘`],2,`②는 모두 수증기가 물방울이 되는 액화이다.`);
m(`증발과 끓음에 대한 설명으로 옳은 것을 모두 고른 것은?`+B([`ㄱ. 50℃의 물에서도 기화가 일어날 수 있다.`,`ㄴ. 물이 끓는 동안 온도는 일정하다.`,`ㄷ. 증발은 끓는점에서만 일어난다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`증발은 끓는점보다 낮은 온도에서도 액체 표면에서 일어난다.`);
m(`얼음물이 든 컵을 전자저울에 올려 질량을 쟀더니 200g → 202g → 204g으로 늘었다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 늘어난 질량은 컵 밖 공기 중 수증기가 액화한 것이다.`,`ㄴ. 같은 실험을 공기가 더 건조한 날 하면 질량이 늘어나는 정도가 작을 것이다.`,`ㄷ. 컵 속 얼음이 녹는 것도 질량이 늘어나는 원인이다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`건조한 날은 공기 중 수증기가 적어 액화하는 양이 적다. 얼음이 녹아도 질량은 변하지 않는다.`);
m(`방 한쪽에 향수를 뿌리고 오래 기다렸더니 방 전체에서 향기가 고르게 났다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 향수 입자는 스스로 끊임없이 운동한다.`,`ㄴ. 바람이 없어도 향기가 퍼진다.`,`ㄷ. 향기가 고르게 퍼지고 나면 입자의 운동이 멈춘다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`입자는 고르게 퍼진 뒤에도 계속 운동한다.`);
m(`액체형 손난로에 대한 설명으로 옳은 것을 모두 고른 것은?`+B([`ㄱ. 사용할 때 액체가 응고하며 열에너지를 방출한다.`,`ㄴ. 다시 쓰려고 끓는 물에 넣으면 융해가 일어나며 열에너지를 흡수한다.`,`ㄷ. 사용하기 전과 후 손난로의 질량은 다르다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`밀봉된 손난로의 질량은 변하지 않는다.`);
m(`물을 가열하며 2분마다 온도를 쟀더니 20, 40, 60, 80, 100, 100, 100℃였다. 이후 불꽃을 더 세게 하여 계속 가열하면 어떻게 되는가?`,[`온도가 100℃보다 높이 올라간다.`,`물이 다 끓어 없어질 때까지 100℃를 유지하고, 물은 더 빨리 줄어든다.`,`온도가 내려간다.`,`물이 응고한다.`,`끓는점이 높아진다.`],2,`끓는 동안 온도는 끓는점으로 일정하다. 불꽃이 세면 기화가 더 빨리 일어날 뿐이다.`);
m(`생활 속 열에너지 이용 사례에 대해 옳은 것을 모두 고른 것은?`+B([`ㄱ. 이글루 안에 물 뿌리기와 과일나무에 물 뿌리기는 모두 응고할 때 방출하는 열을 이용한다.`,`ㄴ. 여름철 마당에 물 뿌리기도 ㄱ과 같은 원리이다.`,`ㄷ. 증기 난방은 수증기가 액화할 때 방출하는 열을 이용한다.`]),[`ㄱ`,`ㄴ`,`ㄱ, ㄷ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`여름철 마당에 물 뿌리기는 증발(기화)할 때 흡수하는 열을 이용한다.`);
m(`물이 담긴 컵에 드라이아이스 조각을 넣었더니 물속에서 거품이 생기고 컵 위로 하얀 연기가 흘러넘쳤다. 옳은 것을 모두 고른 것은?`+B([`ㄱ. 드라이아이스는 승화하여 이산화 탄소 기체가 된다.`,`ㄴ. 하얀 연기는 공기 중 수증기가 차가워져 액화한 물방울이다.`,`ㄷ. 하얀 연기는 이산화 탄소 기체 자체이다.`]),[`ㄱ`,`ㄷ`,`ㄱ, ㄴ`,`ㄴ, ㄷ`,`ㄱ, ㄴ, ㄷ`],3,`이산화 탄소 기체는 투명하여 보이지 않는다.`);
s(`가열 곡선 (가)는 녹는점 50℃에서 4분 동안, (나)는 녹는점 50℃에서 8분 동안, (다)는 녹는점 80℃에서 4분 동안 온도가 일정했다(같은 불꽃 사용). 같은 물질인 것끼리 묶고, 양이 가장 많은 것을 그 까닭과 함께 쓰시오.`,`(가)와 (나)가 같은 물질이다(녹는점이 같음). 이 중 (나)의 양이 더 많다. 녹는 데 걸린 시간이 더 길기 때문이다.`,`녹는점은 물질마다 고유하며, 양에 따라 변하지 않는다.`);
s(`얼음이 녹아도 질량이 변하지 않음을 확인하는 실험을 설계하시오. 또 입구를 막지 않고 오래 두면 결과가 어떻게 달라질 수 있는지 쓰시오.`,`얼음을 넣은 용기의 뚜껑을 닫고 질량을 잰 뒤, 얼음이 다 녹은 다음 다시 질량을 재어 비교한다. 입구를 막지 않으면 녹은 물 일부가 증발해 빠져나가 질량이 줄어든 것처럼 보일 수 있다(또는 바깥 수증기가 액화해 붙어 늘어날 수도 있다).`,``);
s(`물은 얼면 부피가 약 9% 늘어난다. 물 1000cm³를 얼리면 얼음의 부피는 약 얼마가 되는지 구하고, 이 성질 때문에 생활에서 생기는 문제와 해결 방법을 하나씩 쓰시오.`,`약 1090cm³. 문제: 겨울철 수도관 동파, 냉동실 유리병 깨짐 등. 해결: 보온재로 감싸기, 병에 물을 가득 채우지 않기 등`,``);
s(`두 온도계 중 하나의 끝을 젖은 헝겊으로 감싸면 그 온도계의 온도가 더 낮게 나타난다. 그 까닭을 쓰고, 공기가 습한 날과 건조한 날 중 언제 두 온도 차이가 더 큰지 까닭과 함께 쓰시오.`,`헝겊의 물이 증발하면서 열에너지를 흡수하기 때문이다. 건조한 날에 차이가 더 크다. 건조할수록 증발이 잘 되어 열을 더 많이 흡수하기 때문이다.`,``);
s(`동결 건조 식품은 음식을 꽁꽁 얼린 뒤 압력이 매우 낮은 곳에 두어 수분을 없앤다. 이 과정의 상태 변화를 순서대로 쓰고, 그냥 열로 말릴 때보다 좋은 점을 한 가지 쓰시오.`,`응고 → 승화(고체 → 기체). 좋은 점: 높은 열을 쓰지 않아 모양, 맛, 영양이 덜 변한다 / 물을 부으면 원래 상태로 잘 돌아온다 등`,``);
s(`표를 보고 -50℃, 25℃, 120℃에서 각 물질의 상태를 쓰시오.`+T([[`물질`,`녹는점(℃)`,`끓는점(℃)`],[`수은`,-39,357],[`물`,0,100],[`에탄올`,-114,78],[`산소`,-218,-183]]),`-50℃: 수은 고체, 물 고체, 에탄올 액체, 산소 기체 / 25℃: 수은 액체, 물 액체, 에탄올 액체, 산소 기체 / 120℃: 수은 액체, 물 기체, 에탄올 기체, 산소 기체`,``);
s(`에어컨은 실내기와 실외기로 이루어져 있다. 냉매가 순환하며 일어나는 상태 변화와 열에너지 출입을 이용하여 실내가 시원해지고 실외기에서 더운 바람이 나오는 까닭을 설명하시오.`,`실내기에서 냉매가 기화하며 실내의 열에너지를 흡수해 시원해진다. 실외기에서는 기체 냉매가 액화하며 열에너지를 방출해 더운 바람이 나온다.`,``);
s(`더운 지방에서 물을 유리병과 토기 항아리(작은 구멍이 많음)에 각각 담아 두었다. 어느 쪽 물이 더 시원한지 쓰고 그 원리를 설명하시오.`,`토기 항아리. 작은 구멍으로 스며 나온 물이 항아리 표면에서 증발하며 열에너지를 흡수하기 때문이다. 유리병은 물이 스며 나오지 않아 이런 효과가 없다.`,``);
s(`드라이아이스를 밀폐된 유리병이나 페트병에 보관하면 안 되는 까닭을 쓰고, 안전하게 보관하는 방법을 쓰시오.`,`승화하면 부피가 크게 늘어나 병이 터질 수 있다. 공기가 통하는 스티로폼 상자 등에 넣어 보관하고, 맨손으로 만지지 않는다.`,``);
s(`0℃의 얼음과 물이 섞인 비커를 가열하면서 온도를 측정할 때, 처음 얼마 동안 온도가 어떻게 되는지 쓰고, 얼음이 모두 녹은 뒤의 변화도 함께 쓰시오.`,`얼음이 모두 녹을 때까지는 가한 열이 융해에 쓰이므로 0℃로 일정하다. 얼음이 다 녹은 뒤에는 온도가 올라가기 시작한다.`,``);
s(`같은 불꽃으로 물 100g과 물 200g을 각각 가열하였다. 끓기 시작하는 데 걸리는 시간과 끓는점을 비교하여 쓰시오.`,`200g이 끓기 시작하는 데 더 오래 걸린다. 끓는점은 둘 다 100℃로 같다.`,``);
s(`100℃의 끓는 물보다 100℃의 수증기에 데었을 때 화상이 더 심한 까닭을 상태 변화와 열에너지로 설명하시오.`,`수증기가 피부에 닿으면 액화하면서 열에너지를 추가로 방출하기 때문이다. 그래서 같은 온도의 물보다 피부에 더 많은 열을 전달한다.`,``);
s(`겨울철 창문의 성에는 주로 어느 쪽 면에 생기는지 쓰고, 실내 습도가 높을수록 성에가 어떻게 되는지 까닭과 함께 쓰시오.`,`안쪽 면. 습도가 높을수록 실내 공기 중 수증기가 많아 차가운 유리에서 고체로 변하는 양이 많아지므로 성에가 더 많이 생긴다.`,``);
s(`주사기에 에탄올 몇 방울을 넣고 입구를 막아 뜨거운 물에 담갔더니 피스톤이 밀려 나왔다. 담그기 전과 후의 입자 모습을 입자의 개수, 거리, 운동으로 비교하여 설명하시오.`,`입자의 개수와 크기는 같다. 담근 후에는 기화하여 입자 사이의 거리가 멀어지고, 입자 운동이 활발해져 부피가 커진다.`,``);
s(`전기 없이 증발을 이용해 시원한 바람을 만드는 장치를 설계하고, 원리를 쓰시오.`,`예: 선풍기(또는 부채) 앞에 젖은 수건을 걸어 둔다. 바람이 수건의 물을 빠르게 증발시키고, 이때 열에너지를 흡수해 지나가는 공기가 시원해진다.`,`증발 + 바람 + 넓은 표면적이 들어가면 좋은 답`);
s(`습한 날에는 같은 기온이라도 더 덥고 끈적하게 느껴진다. 그 까닭을 증발과 열에너지로 설명하시오.`,`습도가 높으면 땀이 잘 증발하지 않아, 땀이 증발하며 몸의 열을 흡수하는 효과가 줄어들기 때문이다.`,``);
s(`물에 잉크를 떨어뜨리고 저었을 때와 가만히 두었을 때 모두 잉크가 퍼진다. 둘 중 '확산'에 해당하는 것을 쓰고, 확산이 입자의 운동 때문이라는 근거를 쓰시오.`,`가만히 두었을 때. 아무것도 하지 않아도 잉크가 스스로 퍼져 나가므로, 입자가 스스로 끊임없이 운동한다는 것을 알 수 있다. (온도가 높을수록 더 빨리 퍼지는 것도 근거)`,``);
s(`아이스크림 배달에 얼음과 드라이아이스를 쓸 때 각각의 장단점을 상태 변화를 근거로 비교하시오.`,`얼음: 구하기 쉽지만 녹으면(융해) 물이 생겨 포장이 젖는다. 드라이아이스: 승화하므로 물이 생기지 않고 훨씬 차갑게 유지하지만, 맨손으로 만지면 위험하고 밀폐하면 안 된다.`,``);
s(`촛불을 켜면 양초에서 여러 상태 변화가 일어난다. 심지 주변의 양초가 녹는 것부터 흘러내린 촛농이 굳는 것까지 순서대로 상태 변화의 이름을 쓰시오.`,`융해(양초가 녹음) → 기화(녹은 촛농이 심지를 타고 올라가 기체가 됨, 이 기체가 탄다) → 응고(흘러내린 촛농이 굳음)`,``);
s(`자연에서 물이 순환하는 과정(바다의 물 → 수증기 → 구름 → 비·눈 → 쌓인 눈이 녹음)에서 일어나는 상태 변화와 각각의 열에너지 출입을 쓰시오.`,`증발(기화): 흡수 → 구름 생성(액화, 일부는 승화): 방출 → 눈 생성(승화 또는 응고): 방출 → 눈이 녹음(융해): 흡수`,``);

u='K1';l=3;m("소설 「동백꽃」의 구성에 대한 설명으로 알맞은 것은?",["현재의 닭싸움 장면에서 시작하여 감자 사건으로 거슬러 올라갔다가 다시 현재로 돌아온다.","사건이 일어난 순서대로만 진행된다.","결말부터 시작하여 발단으로 끝난다.","여러 인물의 이야기가 번갈아 나온다.","꿈과 현실이 교차한다."],1,"역순행적 구성");
u='K1';l=3;m("소설 「동백꽃」에서 닭싸움이 하는 역할로 알맞은 것은?",["두 인물 사이의 갈등을 겉으로 드러내고 키우는 매개가 된다.","인물들의 신분을 바꾸어 준다.","갈등을 처음부터 없애 준다.","계절의 변화를 알려 준다.","서술자를 바꾸어 준다."],1,"");
u='K1';l=3;m("소설 「동백꽃」의 서술자 '나'의 특징으로 알맞은 것은?",["순박하고 어수룩해서 상황을 제대로 이해하지 못하는 서술자","모든 인물의 속마음을 다 아는 서술자","사건을 냉정하게 분석하는 서술자","작품 밖에서 이야기를 전하는 서술자","거짓말로 독자를 속이려는 서술자"],1,"");
u='K1';l=3;m("소설 「동백꽃」의 갈등 해결 과정으로 알맞은 것은?",["'나'가 점순네 닭을 죽인 뒤, 점순이가 일러바치지 않겠다고 하며 두 사람이 화해한다.","어른들이 나서서 싸움을 말린다.","'나'가 마을을 떠나며 끝난다.","점순이가 '나'에게 사과 편지를 쓴다.","닭싸움 대회에서 '나'가 이긴다."],1,"");
u='K1';l=3;m("다음 중 '내적 갈등'이 나타난 상황은?",["언니는 방을 깨끗이 쓰자고 하고, 동생은 자기 물건에 손대지 말라며 매일 다퉜다.","무인도에 홀로 남겨진 주인공은 거센 파도와 폭풍우 속에서 살아남으려고 몸부림쳤다.","반장 선거에 나가자니 떨어질까 두렵고, 안 나가자니 후회할 것 같아 도현은 마음이 복잡했다.","갑작스러운 눈보라에 갇힌 등산객들은 추위와 배고픔을 견디며 구조를 기다렸다.","가난한 집안 출신이라는 이유로 번번이 승진에서 밀려난 주인공은 불공정한 제도에 맞서기로 했다."],3,"한 인물의 마음속에서 서로 다른 생각이 부딪치고 있기 때문이다.");
u='K1';l=3;m("소설 「동백꽃」의 다음 내용은 소설의 구성 단계 중 어디에 해당하는가?<div class=\"box\"><div>겁에 질려 우는 '나'에게 점순이가 다짐을 받고, 두 사람은 노란 동백꽃 속으로 함께 쓰러진다.</div></div>",["발단","전개","위기","절정","결말"],5,"결말 단계의 내용이다.");
u='K1';l=3;m("소설 「동백꽃」의 내용을 소설에 제시된 순서대로 바르게 배열한 것은?<div class=\"box\"><div>(가) 겁에 질려 우는 '나'에게 점순이가 다짐을 받고, 두 사람은 노란 동백꽃 속으로 함께 쓰러진다.</div><div>(나) 참다못한 '나'가 지게 막대기로 점순네 수탉을 때려 죽인다.</div><div>(다) '나'는 닭이 힘을 내도록 고추장을 먹여 싸움을 붙여 보지만 결국 '나'의 닭이 진다.</div><div>(라) 점순이가 또 '나'의 집 수탉과 자기 집 수탉의 싸움을 붙여 놓은 것을 보고 '나'가 화를 낸다.</div></div>",["(라) → (다) → (가) → (나)","(라) → (다) → (나) → (가)","(다) → (가) → (나) → (라)","(가) → (나) → (라) → (다)","(나) → (가) → (라) → (다)"],2,"");
u='K1';l=3;m("다음 설명에 해당하는 말은?<div class=\"box\"><div>갈등이 최고조에 이르고 사건 해결의 실마리가 나타나는 단계</div></div>",["1인칭 주인공 시점","역순행적 구성","발단","갈등","절정"],5,"");
u='K1';l=3;m("다음 중 '외적 갈등 (인물과 사회)'이 나타난 상황은?",["서얼로 태어난 길동은 아버지를 아버지라 부르지 못하게 하는 신분 제도에 맞서 집을 떠났다.","늙은 어부는 거대한 물고기와 사흘 밤낮을 싸우며 거친 바다 위에서 버텼다.","준호는 시험 전날 밤, 게임을 계속할지 책을 펼칠지 한참을 망설였다.","할머니께 받은 용돈으로 동생 생일 선물을 살지, 갖고 싶던 책을 살지 수아는 결정하지 못했다.","민지는 친구의 비밀을 선생님께 말해야 할지, 약속대로 지켜야 할지 밤새 고민했다."],1,"인물이 사회의 제도, 관습, 편견과 대립하고 있기 때문이다.");
u='K1';l=3;m("소설 「동백꽃」의 내용을 소설에 제시된 순서대로 바르게 배열한 것은?<div class=\"box\"><div>(가) 며칠 전, 점순이가 구운 감자를 내밀었지만 '나'가 거절하자 점순이가 얼굴이 빨개지며 눈물을 보인 일이 있었다.</div><div>(나) 점순이가 또 '나'의 집 수탉과 자기 집 수탉의 싸움을 붙여 놓은 것을 보고 '나'가 화를 낸다.</div><div>(다) 겁에 질려 우는 '나'에게 점순이가 다짐을 받고, 두 사람은 노란 동백꽃 속으로 함께 쓰러진다.</div><div>(라) 참다못한 '나'가 지게 막대기로 점순네 수탉을 때려 죽인다.</div></div>",["(다) → (라) → (나) → (가)","(다) → (나) → (가) → (라)","(나) → (가) → (라) → (다)","(다) → (라) → (가) → (나)","(라) → (다) → (가) → (나)"],3,"");
u='K1';l=3;m("다음 설명에 해당하는 말은?<div class=\"box\"><div>시골의 소박한 풍경, 사투리, 풍습 등이 자아내는 분위기</div></div>",["외적 갈등","역순행적 구성","발단","배경","향토적 분위기"],5,"");
u='K1';l=3;m("다음 중 '외적 갈등 (인물과 자연)'이 나타난 상황은?",["마을의 오래된 규칙 때문에 사랑하는 사람과 결혼할 수 없게 된 두 사람은 그 규칙에 맞섰다.","가난한 집안 출신이라는 이유로 번번이 승진에서 밀려난 주인공은 불공정한 제도에 맞서기로 했다.","우리말을 쓰지 못하게 하는 법이 있던 시절, 선생님은 몰래 한글을 가르치다 붙잡혀 갔다.","놀부는 흥부가 부자가 된 것을 시기하여 흥부를 찾아가 괴롭혔다.","무인도에 홀로 남겨진 주인공은 거센 파도와 폭풍우 속에서 살아남으려고 몸부림쳤다."],5,"인물이 자연의 힘(바다, 날씨, 재해 등)과 맞서고 있기 때문이다.");
u='K1';l=3;m("소설 「동백꽃」의 내용을 소설에 제시된 순서대로 바르게 배열한 것은?<div class=\"box\"><div>(가) '나'는 닭이 힘을 내도록 고추장을 먹여 싸움을 붙여 보지만 결국 '나'의 닭이 진다.</div><div>(나) 며칠 전, 점순이가 구운 감자를 내밀었지만 '나'가 거절하자 점순이가 얼굴이 빨개지며 눈물을 보인 일이 있었다.</div><div>(다) 점순이가 또 '나'의 집 수탉과 자기 집 수탉의 싸움을 붙여 놓은 것을 보고 '나'가 화를 낸다.</div><div>(라) 겁에 질려 우는 '나'에게 점순이가 다짐을 받고, 두 사람은 노란 동백꽃 속으로 함께 쓰러진다.</div></div>",["(다) → (나) → (라) → (가)","(라) → (나) → (가) → (다)","(라) → (가) → (다) → (나)","(다) → (나) → (가) → (라)","(다) → (라) → (가) → (나)"],4,"");
u='K1';l=3;m("다음 설명에 해당하는 말은?<div class=\"box\"><div>현재의 사건을 먼저 제시한 뒤 과거로 거슬러 올라갔다가 다시 현재로 돌아오는 구성</div></div>",["배경","역순행적 구성","발단","결말","전개"],2,"");
u='K1';l=3;m("다음 중 '외적 갈등 (인물과 인물)'이 나타난 상황은?",["늙은 어부는 거대한 물고기와 사흘 밤낮을 싸우며 거친 바다 위에서 버텼다.","오디션에 나가고 싶지만 무대에 서는 것이 두려워, 서윤은 지원서를 낼지 말지 망설였다.","언니는 방을 깨끗이 쓰자고 하고, 동생은 자기 물건에 손대지 말라며 매일 다퉜다.","가뭄으로 논바닥이 갈라지자 농부는 타들어 가는 벼를 살리려고 밤낮으로 물을 길었다.","할머니께 받은 용돈으로 동생 생일 선물을 살지, 갖고 싶던 책을 살지 수아는 결정하지 못했다."],3,"두 인물이 서로 다른 생각이나 이익 때문에 대립하고 있기 때문이다.");

u='K1';l=3;s("소설 「동백꽃」의 구성 방식을 쓰고, 그 특징을 설명하시오.","역순행적 구성. 현재의 닭싸움 장면을 먼저 보여 준 뒤 과거의 감자 사건으로 거슬러 올라갔다가 다시 현재로 돌아온다.","");
u='K1';l=3;s("소설 「동백꽃」에서 '나'가 점순네 닭을 죽인 뒤 겁에 질려 운 까닭을 사회적 배경과 관련지어 쓰시오.","'나'의 집은 마름인 점순네에게 땅을 얻어 농사짓는 소작인이라, 점순네의 닭을 죽인 일로 땅을 떼일까 봐 두려웠기 때문이다.","");
u='K1';l=3;s("소설 「동백꽃」에서 닭싸움이 갈등의 전개에서 하는 역할을 쓰시오.","점순이가 '나'에게 서운한 마음을 드러내는 수단이자, 두 사람의 갈등이 겉으로 드러나고 커지는 매개가 된다.","");
u='K1';l=3;s("다음 상황에 나타난 갈등의 종류를 쓰고, 그렇게 판단한 까닭을 쓰시오.<div class=\"box\"><div>놀부는 흥부가 부자가 된 것을 시기하여 흥부를 찾아가 괴롭혔다.</div></div>","외적 갈등 (인물과 인물). 두 인물이 서로 다른 생각이나 이익 때문에 대립하고 있기 때문이다.","");
u='K1';l=3;s("소설 「동백꽃」의 다음 내용은 소설의 구성 단계 중 어느 단계에 해당하는지 쓰시오.<div class=\"box\"><div>며칠 전, 점순이가 구운 감자를 내밀었지만 '나'가 거절하자 점순이가 얼굴이 빨개지며 눈물을 보인 일이 있었다.</div></div>","전개","");

u='K1';l=5;s("소설 「동백꽃」의 갈등 원인을 개인적 원인과 사회적 원인으로 나누어 쓰시오.","개인적 원인: 점순이의 서툰 애정 표현과 이를 알아차리지 못하는 '나'의 어수룩함. 사회적 원인: 마름과 소작인이라는 두 집안의 신분 차이.","");
u='K1';l=5;s("소설 「동백꽃」의 결말에서 '동백꽃'이 지니는 의미를 쓰시오.","두 사람의 갈등이 풀리고 화해와 사랑이 시작됨을 보여 주는 소재이다.","");
u='K1';l=5;s("다음 상황에 나타난 갈등의 종류를 쓰고, 그렇게 판단한 까닭을 쓰시오.<div class=\"box\"><div>오디션에 나가고 싶지만 무대에 서는 것이 두려워, 서윤은 지원서를 낼지 말지 망설였다.</div></div>","내적 갈등. 한 인물의 마음속에서 서로 다른 생각이 부딪치고 있기 때문이다.","");
u='K1';l=5;s("소설 「동백꽃」의 내용을 소설에 제시된 순서대로 배열하시오.<div class=\"box\"><div>(가) '나'는 닭이 힘을 내도록 고추장을 먹여 싸움을 붙여 보지만 결국 '나'의 닭이 진다.</div><div>(나) 며칠 전, 점순이가 구운 감자를 내밀었지만 '나'가 거절하자 점순이가 얼굴이 빨개지며 눈물을 보인 일이 있었다.</div><div>(다) 겁에 질려 우는 '나'에게 점순이가 다짐을 받고, 두 사람은 노란 동백꽃 속으로 함께 쓰러진다.</div><div>(라) 점순이가 또 '나'의 집 수탉과 자기 집 수탉의 싸움을 붙여 놓은 것을 보고 '나'가 화를 낸다.</div></div>","(라) → (나) → (가) → (다)","현재 장면(발단) → 감자 사건 회상(전개) → … 순서로 제시된다.");
u='K1';l=5;s("다음 상황에 나타난 갈등의 종류를 쓰고, 그렇게 판단한 까닭을 쓰시오.<div class=\"box\"><div>가난한 집안 출신이라는 이유로 번번이 승진에서 밀려난 주인공은 불공정한 제도에 맞서기로 했다.</div></div>","외적 갈등 (인물과 사회). 인물이 사회의 제도, 관습, 편견과 대립하고 있기 때문이다.","");
u='K1';l=5;s("소설 「동백꽃」의 내용을 소설에 제시된 순서대로 배열하시오.<div class=\"box\"><div>(가) 며칠 전, 점순이가 구운 감자를 내밀었지만 '나'가 거절하자 점순이가 얼굴이 빨개지며 눈물을 보인 일이 있었다.</div><div>(나) 겁에 질려 우는 '나'에게 점순이가 다짐을 받고, 두 사람은 노란 동백꽃 속으로 함께 쓰러진다.</div><div>(다) 참다못한 '나'가 지게 막대기로 점순네 수탉을 때려 죽인다.</div><div>(라) '나'는 닭이 힘을 내도록 고추장을 먹여 싸움을 붙여 보지만 결국 '나'의 닭이 진다.</div></div>","(가) → (라) → (다) → (나)","현재 장면(발단) → 감자 사건 회상(전개) → … 순서로 제시된다.");

u='K1';l=9;m("소설 「동백꽃」에서 사건이 '실제로 일어난 순서'와 '소설에 제시된 순서'에 대한 설명으로 알맞은 것은?",["감자 사건은 실제로는 가장 먼저 일어났지만 소설에서는 닭싸움 장면 뒤에 회상으로 제시된다.","두 순서는 완전히 같다.","절정 장면이 소설의 맨 처음에 제시된다.","결말이 실제로 가장 먼저 일어난 사건이다.","소설에 제시된 순서는 실제 순서와 반대로 완전히 거꾸로이다."],1,"역순행적 구성의 특징");
u='K1';l=9;m("다음은 소설 「동백꽃」을 읽은 학생들의 생각이다. 작품을 바르게 이해한 학생을 모두 고른 것은?<div class=\"box\"><div>민수: 점순이가 닭싸움을 붙인 건 '나'를 정말 미워해서야.</div><div>지아: '나'가 감자를 거절한 데에는 가난에 대한 자존심이 작용했어.</div><div>하준: '나'가 끝까지 점순이에게 맞서지 못한 데에는 신분 차이가 영향을 줬어.</div><div>서연: 동백꽃은 두 사람의 갈등이 더 커진다는 것을 보여 줘.</div></div>",["민수, 지아","지아, 하준","하준, 서연","민수, 서연","지아, 하준, 서연"],2,"점순이는 미움이 아니라 서운함 때문에 괴롭혔고, 동백꽃은 화해를 상징한다.");
u='K1';l=9;m("소설 「동백꽃」의 '나'와 같은 서술자를 '믿을 수 없는(어수룩한) 서술자'라고 부르기도 한다. 그 까닭으로 가장 알맞은 것은?",["서술자가 사건과 인물의 마음을 제대로 이해하지 못한 채 이야기해서, 독자가 서술자의 말과 다른 진실을 알아차리게 되기 때문","서술자가 일부러 거짓말을 하기 때문","서술자가 여러 명이기 때문","서술자가 작품 밖에 있기 때문","서술자가 사건에 참여하지 않기 때문"],1,"");

u='K1';l=9;s("소설 「동백꽃」을 점순이가 서술자인 1인칭 주인공 시점으로 바꾸어 쓴다면, 감자 사건 장면이 어떻게 달라질지 쓰시오.","점순이가 '나'를 좋아하는 마음과, 감자를 거절당했을 때의 서운함과 부끄러움이 직접 드러나게 된다. 대신 독자가 점순이의 마음을 짐작하며 느끼는 웃음은 줄어든다.","시점이 바뀌면 드러나는 정보와 웃음의 효과가 달라진다.");
u='K1';l=9;s("소설 「동백꽃」에서 '나'의 행동을 통해 1930년대 농촌의 어떤 현실을 알 수 있는지 쓰시오.","땅을 가진 지주와 그 땅을 관리하는 마름의 힘이 커서, 소작농은 땅을 떼일까 봐 마름 집안에 함부로 맞서지 못하는 현실을 알 수 있다.","");
u='K1';l=9;s("소설 「동백꽃」의 갈등이 해결되는 방식의 특징을 쓰고, 그것이 작품 분위기에 주는 효과를 쓰시오.","심각한 대립 대신, 점순이의 다짐과 동백꽃 속으로 쓰러지는 장면으로 갑자기 화해하며 마무리된다. 이로 인해 작품 전체가 밝고 익살스러운(해학적인) 분위기를 유지한다.","");
u='K1';l=9;s("다음 상황에 나타난 갈등의 종류를 쓰고, 그렇게 판단한 까닭을 쓰시오.<div class=\"box\"><div>할머니께 받은 용돈으로 동생 생일 선물을 살지, 갖고 싶던 책을 살지 수아는 결정하지 못했다.</div></div>","내적 갈등. 한 인물의 마음속에서 서로 다른 생각이 부딪치고 있기 때문이다.","");

<script>
(function(){

var SUB={sci:{name:'과학',units:['F','S'],desc:'과학 2단원 400문항',note:"기체→고체 변화는 교과서에 따라 '승화' 또는 '증착'이라고 해요."},
 math:{name:'수학',units:['M1','M2'],desc:'수학(천재) 2단원 400문항: 기본 도형, 다각형, 원과 부채꼴',note:'기둥의 겉넓이와 부피는 기말고사 범위라 넣지 않았어요. 원주율은 π로 답해요.'},
 kor:{name:'국어',units:['K1','K2'],desc:'국어(미래엔) 2단원 400문항: 「동백꽃」, 단어의 짜임과 새말',note:'「동백꽃」 본문은 그대로 싣지 않고 내용을 풀어서 문제로 만들었어요. 교과서로 본문을 꼭 다시 읽어 보세요.'}};
var FIRST={F:1,M1:1,K1:1};
// ids + deterministic shuffle for plain-text choices (keeps ㄱㄴㄷ combos and numeric options in order)
var cnt={};
function rng(seed){return function(){seed=(seed*1103515245+12345)%2147483648;return seed/2147483648}}
D.forEach(function(d,i){
  var k=d.u+d.l+d.t; cnt[k]=(cnt[k]||0)+1; d.id=d.u+'-'+d.l+'-'+d.t+cnt[k]; d.i=i;
  if(d.t==='m'){
    var plain=d.c.every(function(c){return !/^[ㄱ-ㅎ]/.test(c)&&!/^[\d약\-(]/.test(c)&&!/(모두|없다|알 수 없다|변하지 않는다|모든 상태)/.test(c)});
    if(plain){var r=rng(i*7919+13),idx=[0,1,2,3,4];for(var j=4;j>0;j--){var x=Math.floor(r()*(j+1));var t=idx[j];idx[j]=idx[x];idx[x]=t}
      var corr=d.c[d.a-1]; d.c=idx.map(function(n){return d.c[n]}); d.a=d.c.indexOf(corr)+1;}
  }
});
var st={sub:'sci',u:'all',l:'all',t:'all',star:false,exam:false,mock:null,show:40};
var stars={}; try{stars=JSON.parse(localStorage.getItem('sci-stars')||'{}')}catch(e){stars={}}
var typed={}; try{typed=JSON.parse(localStorage.getItem('sci-typed')||'{}')}catch(e){typed={}}
var marks={}; try{marks=JSON.parse(localStorage.getItem('sci-marks')||'{}')}catch(e){marks={}}
var saveT=null; function saveTyped(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem('sci-typed',JSON.stringify(typed))}catch(e){}},400)}
function saveMarks(){try{localStorage.setItem('sci-marks',JSON.stringify(marks))}catch(e){}}
function saveStars(){try{localStorage.setItem('sci-stars',JSON.stringify(stars))}catch(e){}}
function segs(el,key,opts){el.innerHTML='';opts.forEach(function(o){var b=document.createElement('button');b.type='button';b.className='seg';b.textContent=o[1];
  b.setAttribute('aria-pressed',(key==='star'?String(st.star===o[0]):String(st[key]===o[0])));
  b.onclick=function(){if(key==='star'){st.star=!st.star}else{st[key]=o[0]} st.mock=null;st.show=40;draw()};el.appendChild(b)})}
function filtered(){if(st.mock)return st.mock;var us=SUB[st.sub].units;return D.filter(function(d){return us.indexOf(d.u)>=0&&(st.u==='all'||d.u===st.u)&&(st.l==='all'||String(d.l)===st.l)&&(st.t==='all'||d.t===st.t)&&(!st.star||stars[d.id])})}
function esc(t){return t}
function card(d,n){
  var li=document.createElement('li');li.className='q '+(FIRST[d.u]?'F':'S');

   '<button class="star" type="button" aria-label="다시 볼 문제로 표시" aria-pressed="'+(!!stars[d.id])+'">★</button></div>'+
   '<div class="qtext">'+d.q+'</div>';
  if(d.t==='m'){h+='<ul class="choices">'+d.c.map(function(c,k){return '<li><button type="button" class="choice" data-k="'+(k+1)+'"><span class="no">'+NO[k]+'</span><span>'+c+'</span></button></li>'}).join('')+'</ul>';}
  else{h+='<div class="typed"><textarea aria-label="'+n+'번 답 쓰기" placeholder="여기에 답을 써 보세요"></textarea><div class="saved"></div></div><div class="lines">'+(d.l>=5?'<div></div><div></div><div></div><div></div>':d.l>=3?'<div></div><div></div><div></div>':'<div></div>')+'</div>';}
  h+='<div class="reveal"><button class="btn" type="button">정답 보기</button></div>';
  h+='<div class="ans">'+(d.t==='s'?'<div class="mine"></div>':'')+'<div class="hand'+(d.t==='s'&&d.a.length>30?' long':'')+'">'+(d.t==='m'?'정답 '+NO[d.a-1]:d.a)+'</div>'+(d.e?'<div class="exp">'+d.e+'</div>':'')+(d.t==='s'?'<div class="self">내 답은? <button class="btn" type="button" data-m="o">맞았어요</button><button class="btn" type="button" data-m="h">절반만</button><button class="btn" type="button" data-m="x">틀렸어요</button></div>':'')+'</div>';
  li.innerHTML=h;

    var ta=li.querySelector('textarea'),sv=li.querySelector('.saved'),mine=li.querySelector('.mine');
    ta.value=typed[d.id]||'';
    function grow(){ta.style.height='auto';ta.style.height=Math.max(72,ta.scrollHeight+4)+'px'}
    ta.addEventListener('input',function(){if(ta.value.trim())typed[d.id]=ta.value;else delete typed[d.id];saveTyped();sv.textContent='저장됨';grow()});
    setTimeout(grow,0);
    var showMine=function(){var v=(typed[d.id]||'').trim();mine.innerHTML=v?'<b>내 답:</b> '+v.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]}):'<b>내 답:</b> (아직 쓰지 않았어요)'};
    li._showMine=showMine;

  }

  li.querySelectorAll('.choice').forEach(function(b){b.onclick=function(){if(st.exam)return;var k=+b.dataset.k;
    li.querySelectorAll('.choice').forEach(function(x){x.classList.remove('right','wrong')});
    li.querySelector('.choice[data-k="'+d.a+'"]').classList.add('right'); if(k!==d.a)b.classList.add('wrong');

  return li;

function draw(){
  var fs=document.getElementById('fs');fs.innerHTML='';Object.keys(SUB).forEach(function(k){var b=document.createElement('button');b.type='button';b.className='seg sub';b.textContent=SUB[k].name;b.setAttribute('aria-pressed',String(st.sub===k));
    b.onclick=function(){st.sub=k;st.u='all';st.mock=null;st.show=40;draw()};fs.appendChild(b)});
  var S0=SUB[st.sub];segs(document.getElementById('fu'),'u',[['all','전체']].concat(S0.units.map(function(x){return [x,UN[x]]})));
  document.getElementById('subDesc').textContent=S0.desc+'. 배점별로 객관식과 서술형이 반씩 들어 있어요.';
  document.getElementById('subNote').textContent=S0.note;
  document.getElementById('unitTags').innerHTML=S0.units.map(function(x,i){return '<span class="unit-tag '+(i?'s':'f')+'">'+UN[x]+' 200</span>'}).join('');
  segs(document.getElementById('fl'),'l',[['all','전체'],['1','1점'],['2','2점'],['3','3점'],['5','5점'],['9','최상위']]);
  var ft=document.getElementById('ft');segs(ft,'t',[['all','전체'],['m','객관식'],['s','서술형']]);
  var sb=document.createElement('button');sb.type='button';sb.className='seg';sb.textContent='★ 다시 볼 문제';sb.setAttribute('aria-pressed',String(st.star));
  sb.onclick=function(){st.star=!st.star;st.mock=null;st.show=40;draw()};ft.appendChild(sb);
  var list=document.getElementById('list'),arr=filtered(),lim=(st.exam||st.mock)?arr.length:Math.min(st.show,arr.length);
  list.innerHTML='';
  if(!arr.length){list.innerHTML='<li class="empty">'+(st.star?'아직 ★로 표시한 문제가 없어요. 문제 오른쪽 위의 ★을 눌러 모아 보세요.':'조건에 맞는 문제가 없어요. 필터를 바꿔 보세요.')+'</li>'}
  for(var i=0;i<lim;i++)list.appendChild(card(arr[i],i+1));
  if(lim<arr.length){var mb=document.createElement('button');mb.className='btn more';mb.type='button';mb.textContent='40문항 더 보기 ('+lim+' / '+arr.length+')';mb.onclick=function(){st.show+=40;draw()};var w=document.createElement('li');w.appendChild(mb);list.appendChild(w)}
  document.getElementById('count').textContent=st.mock?SUB[st.sub].name+' 모의고사 '+arr.length+'문항':arr.length+'문항';
  var key=document.getElementById('key');
  key.innerHTML='<h2>정답과 해설</h2>'+arr.map(function(d,i){return '<div class="k"><b>'+(i+1)+'.</b> <span class="hand">'+(d.t==='m'?NO[d.a-1]:d.a)+'</span>'+(d.e?'<div class="exp" style="color:var(--muted)">'+d.e+'</div>':'')+'</div>'}).join('');
  document.body.classList.toggle('exam',st.exam);
  document.getElementById('modeBtn').textContent=st.exam?'공부하기 모드로 바꾸기':'시험지 모드로 바꾸기';
}
function pick(a,n){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a.slice(0,n)}
document.getElementById('mockBtn').onclick=function(){
  var us=SUB[st.sub].units;var pool=D.filter(function(d){return us.indexOf(d.u)>=0&&(st.u==='all'||d.u===st.u)}),mc=[],sa=[];
  [1,2,3,5,9].forEach(function(lv){mc=mc.concat(pick(pool.filter(function(d){return d.l===lv&&d.t==='m'}),2));sa=sa.concat(pick(pool.filter(function(d){return d.l===lv&&d.t==='s'}),2))});
  st.mock=mc.concat(sa);draw();window.scrollTo({top:document.getElementById('list').offsetTop-150,behavior:'smooth'})};
document.getElementById('modeBtn').onclick=function(){st.exam=!st.exam;draw()};
document.getElementById('printBtn').onclick=function(){window.print()};
draw();
})();
</script>
</body>
</html>
